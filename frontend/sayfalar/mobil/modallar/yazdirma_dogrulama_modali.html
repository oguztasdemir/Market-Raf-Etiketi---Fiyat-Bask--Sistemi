<div id="modal-mob-print-verification" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 10000; align-items: center; justify-content: center; padding: 14px;">
    <div style="background: #131b2e; border: 1px solid var(--border); border-radius: 16px; padding: 18px; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); max-height: 90vh;">
      
      <div style="text-align: center;">
        <h3 style="font-size: 16px; color: #38bdf8; margin: 0;">🖨️ Yazdırma Tamamlandı mı?</h3>
        <p style="font-size: 11.5px; color: var(--text-muted); margin-top: 4px;">Çıkan etiketleri kontrol edin. Hatalı olan varsa işaretleyin.</p>
      </div>

      <!-- Tümünü Seç / Kaldır -->
      <div style="display: flex; justify-content: space-between; align-items: center; background: #090d16; padding: 8px 10px; border-radius: 8px; font-size: 12px;">
        <span style="color: var(--text-muted);">Hatalı çıkanları seçin:</span>
        <button onclick="toggleSelectAllMobVerify()" style="background: #1e293b; color: #38bdf8; border: 1px solid var(--border); padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700;">
          ☑️ Tümünü Seç / Kaldır
        </button>
      </div>

      <!-- Liste -->
      <div id="mob-verify-list" style="max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;"></div>

      <div id="mob-verify-summary" style="font-size: 11.5px; color: #38bdf8; font-weight: 700; text-align: center;">
        Tüm ürünler güncellenmeye hazır.
      </div>

      <button id="btn-mob-verify-action" onclick="confirmMobPrintVerification()" style="width: 100%; background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; padding: 13px; border-radius: 12px; font-size: 13px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);">
        ✅ Evet, Tümü Başarıyla Basıldı (Verileri Güncelle)
      </button>

    </div>
  </div>
