<!-- =========================================================
     MOBİL PERSONEL GİRİŞİ & YETKİ KONTROL PANELİ
     ========================================================= -->
<div id="modal-mobile-auth" class="modal-backdrop" style="position: fixed; inset: 0; background: rgba(3, 7, 18, 0.96); backdrop-filter: blur(12px); display: none; align-items: center; justify-content: center; z-index: 999999999; padding: 16px; box-sizing: border-box;">
  <div style="max-width: 420px; width: 100%; background: #0f172a; border: 1.5px solid rgba(56,189,248,0.4); border-radius: 18px; box-shadow: 0 25px 60px rgba(0,0,0,0.9); overflow: hidden; display: flex; flex-direction: column;">
    
    <!-- Başlık & Karşılama -->
    <div style="background: linear-gradient(135deg, #1e293b, #0f172a); padding: 20px 20px 16px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.08);">
      <div style="width: 56px; height: 56px; border-radius: 16px; background: rgba(56,189,248,0.15); border: 1.5px solid rgba(56,189,248,0.4); display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 10px auto; box-shadow: 0 8px 20px rgba(56,189,248,0.25);">
        🔐
      </div>
      <h2 style="margin: 0 0 4px 0; font-size: 18px; font-weight: 900; color: #f8fafc; letter-spacing: 0.3px;">
        Personel Girişi
      </h2>
      <p style="margin: 0; color: #94a3b8; font-size: 12px;">
        Lütfen devam etmek için profilinizi seçin:
      </p>
    </div>

    <!-- Gövde: Personel Seçimi ve PIN Girişi -->
    <div style="padding: 20px; display: flex; flex-direction: column; gap: 16px;">
      
      <!-- 1. Adım: Personel Listesi / Seçimi -->
      <div id="mob-auth-select-step" style="display: flex; flex-direction: column; gap: 10px;">
        <label style="font-size: 11px; font-weight: 800; color: #38bdf8; text-transform: uppercase; margin: 0;">
          ÇALIŞAN SEÇİN:
        </label>
        <div id="mob-auth-employees-list" style="display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; padding-right: 2px;">
          <div style="text-align: center; padding: 20px; color: #64748b; font-size: 12px;">Çalışanlar yükleniyor...</div>
        </div>
      </div>

      <!-- 2. Adım: PIN Kodu Girişi (PIN Varsa) -->
      <div id="mob-auth-pin-step" style="display: none; flex-direction: column; gap: 12px; text-align: center;">
        <div style="display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.04); padding: 8px 12px; border-radius: 8px;">
          <div style="display: flex; align-items: center; gap: 8px; text-align: left;">
            <span style="font-size: 20px;">👤</span>
            <div>
              <strong id="mob-pin-selected-name" style="color: #f8fafc; font-size: 13.5px; display: block;">-</strong>
              <small id="mob-pin-selected-role" style="color: #38bdf8; font-size: 11px;">-</small>
            </div>
          </div>
          <button type="button" onclick="mobAuthBackToSelect()" style="background: transparent; border: none; color: #94a3b8; font-size: 12px; cursor: pointer; text-decoration: underline;">
            Değiştir
          </button>
        </div>

        <div style="margin: 4px 0;">
          <label style="font-size: 11px; font-weight: 800; color: #fbbf24; text-transform: uppercase; display: block; margin-bottom: 6px;">
            4 HANELİ KASA / GİRİŞ PIN KODU
          </label>
          <input type="password" id="mob-auth-pin-input" readonly maxlength="6" placeholder="● ● ● ●" style="width: 100%; text-align: center; font-size: 24px; letter-spacing: 10px; padding: 10px; background: #090e1a; border: 2px solid rgba(251,191,36,0.5); border-radius: 10px; color: #fbbf24; outline: none; box-sizing: border-box;">
        </div>

        <!-- Numpad Tuş Takımı -->
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px;">
          <button type="button" class="mob-numpad-btn" onclick="mobAuthNumpadPress('1')">1</button>
          <button type="button" class="mob-numpad-btn" onclick="mobAuthNumpadPress('2')">2</button>
          <button type="button" class="mob-numpad-btn" onclick="mobAuthNumpadPress('3')">3</button>
          <button type="button" class="mob-numpad-btn" onclick="mobAuthNumpadPress('4')">4</button>
          <button type="button" class="mob-numpad-btn" onclick="mobAuthNumpadPress('5')">5</button>
          <button type="button" class="mob-numpad-btn" onclick="mobAuthNumpadPress('6')">6</button>
          <button type="button" class="mob-numpad-btn" onclick="mobAuthNumpadPress('7')">7</button>
          <button type="button" class="mob-numpad-btn" onclick="mobAuthNumpadPress('8')">8</button>
          <button type="button" class="mob-numpad-btn" onclick="mobAuthNumpadPress('9')">9</button>
          <button type="button" class="mob-numpad-btn" onclick="mobAuthNumpadClear()" style="color: #f87171; font-weight: 900;">C</button>
          <button type="button" class="mob-numpad-btn" onclick="mobAuthNumpadPress('0')">0</button>
          <button type="button" class="mob-numpad-btn" onclick="mobAuthNumpadBackspace()" style="color: #fbbf24; font-size: 18px;">⌫</button>
        </div>

        <button type="button" onclick="mobAuthVerifyPin()" style="margin-top: 6px; width: 100%; padding: 12px; background: linear-gradient(135deg, #059669, #047857); border: none; border-radius: 10px; color: #ffffff; font-size: 14px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 15px rgba(16,185,129,0.35);">
          🔓 Giriş Yap
        </button>
      </div>

    </div>

    <!-- Alt Güvenlik Notu -->
    <div style="padding: 10px 20px; background: #090e1a; border-top: 1px solid rgba(255,255,255,0.06); text-align: center; color: #64748b; font-size: 11px;">
      🔒 Yetkili personel erişim kontrolü
    </div>

  </div>
</div>

<style>
.mob-numpad-btn {
  background: #1e293b;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  color: #f8fafc;
  font-size: 20px;
  font-weight: 800;
  padding: 12px 0;
  cursor: pointer;
  transition: all 0.1s ease;
  user-select: none;
}
.mob-numpad-btn:active {
  background: #38bdf8;
  color: #0f172a;
  transform: scale(0.96);
}
.mob-emp-row {
  background: #1e293b;
  border: 1.5px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transition: all 0.15s ease;
  user-select: none;
}
.mob-emp-row:active {
  border-color: #38bdf8;
  background: rgba(56,189,248,0.15);
  transform: scale(0.98);
}
</style>
