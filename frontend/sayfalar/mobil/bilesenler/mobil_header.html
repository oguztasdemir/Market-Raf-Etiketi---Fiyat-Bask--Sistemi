<header class="mobile-header" style="display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #0b1329; border-bottom: 1px solid rgba(255,255,255,0.08);">
  <div class="brand-flex" style="display: flex; align-items: center; gap: 8px;">
    <div class="brand-icon" style="font-size: 20px;">📱</div>
    <div>
      <div class="brand-title" style="font-size: 13px; font-weight: 800; color: #f8fafc;">Mobil Raf Terminali</div>
      <div id="mob-header-user-badge" onclick="openMobileAuthModal()" style="font-size: 11px; color: #38bdf8; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 4px;">
        <span id="mob-header-user-name">Giriş Yapılmadı</span>
        <span style="font-size: 9px; opacity: 0.7;">▾</span>
      </div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 8px;">
    <div style="font-size: 10.5px; color: var(--text-muted, #94a3b8); display:flex; align-items:center; gap:4px; background: rgba(255,255,255,0.04); padding: 4px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.06);">
      <span style="width:6px; height:6px; background:#10b981; border-radius:50%;"></span>
      <span id="txt-printer-name" style="max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Yazıcı Hazır</span>
    </div>
    <button type="button" onclick="logoutMobileEmployee()" title="Personel Değiştir / Çıkış Yap" style="background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); border-radius: 6px; color: #f87171; padding: 4px 8px; font-size: 11px; font-weight: 800; cursor: pointer;">
      🚪 Çıkış
    </button>
  </div>
</header>
