<div id="mob-tab-stock-audit" class="mobile-tab-content" style="display: none; flex-direction: column; padding: 12px; gap: 10px; padding-bottom: 75px;">
  <!-- Başlık ve Hızlı Eylem Kartı -->
  <div style="background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(2,132,199,0.15)); border: 1px solid rgba(16,185,129,0.3); border-radius: 12px; padding: 12px; display: flex; justify-content: space-between; align-items: center;">
    <div>
      <h3 style="margin: 0; font-size: 15px; font-weight: 900; color: #34d399;">📦 Reyon Stok Sayım Modülü</h3>
      <small style="color: #94a3b8; font-size: 11px;">Barkod okutarak raftaki gerçek adedi sayın</small>
    </div>
    <button type="button" onclick="clearStockAuditSession()" class="btn-secondary" style="padding: 4px 8px; font-size: 11px; color: #f87171; border-color: rgba(239,68,68,0.3);">
      🔄 Sıfırla
    </button>
  </div>

  <!-- Sayım Özet KPI'ları -->
  <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;">
    <div style="background: #0f172a; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 8px; text-align: center;">
      <div style="font-size: 10px; color: #94a3b8; font-weight: 700;">SAYILAN KALEM</div>
      <div id="mob-audit-item-count" style="font-size: 15px; font-weight: 900; color: #38bdf8;">0</div>
    </div>
    <div style="background: #0f172a; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 8px; text-align: center;">
      <div style="font-size: 10px; color: #94a3b8; font-weight: 700;">TOPLAM ADET</div>
      <div id="mob-audit-total-qty" style="font-size: 15px; font-weight: 900; color: #34d399;">0</div>
    </div>
    <div style="background: #0f172a; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 8px; text-align: center;">
      <div style="font-size: 10px; color: #94a3b8; font-weight: 700;">FARK ADEDİ</div>
      <div id="mob-audit-diff-qty" style="font-size: 15px; font-weight: 900; color: #fbbf24;">0</div>
    </div>
  </div>

  <!-- Hızlı Barkod Girişi / Kamera Aç Butonu -->
  <div style="display: flex; gap: 6px;">
    <input type="text" id="mob-audit-barcode-input" placeholder="Barkod okutun veya yazın..." style="flex: 1; padding: 8px 12px; background: #070d1e; border: 1.5px solid #334155; border-radius: 8px; color: #fff; font-size: 13px;" onkeydown="if(event.key==='Enter') submitMobAuditBarcode()">
    <button type="button" onclick="startFullscreenScanner('audit')" style="background: #0284c7; border: none; color: #fff; padding: 0 14px; border-radius: 8px; font-size: 14px; font-weight: 800;">
      📷
    </button>
  </div>

  <!-- Sayılan Ürünler Listesi -->
  <div style="background: #0b1329; border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 8px; flex: 1; min-height: 240px; display: flex; flex-direction: column;">
    <div style="font-size: 11.5px; font-weight: 800; color: #94a3b8; margin-bottom: 6px; display: flex; justify-content: space-between;">
      <span>SAYIM LİSTESİ</span>
      <span id="mob-audit-status-hint" style="color: #38bdf8;">Canlı Kaydediliyor</span>
    </div>
    <div id="mob-audit-items-list" style="display: flex; flex-direction: column; gap: 6px; overflow-y: auto; max-height: 380px;">
      <!-- JS Dinamik Dolduracak -->
      <div style="text-align: center; color: #64748b; font-size: 12px; padding: 30px 10px;">
        📷 Kamerayı açarak veya barkod yazarak reyon sayımına başlayın.
      </div>
    </div>
  </div>

  <!-- Sayımı Tamamla / Kataloğa Eşle Butonu -->
  <button type="button" onclick="commitStockAuditToCatalog()" style="background: linear-gradient(135deg, #10b981, #059669); border: none; color: #fff; padding: 12px; border-radius: 10px; font-weight: 900; font-size: 13px; cursor: pointer; box-shadow: 0 4px 14px rgba(16,185,129,0.4); display: flex; align-items: center; justify-content: center; gap: 8px;">
    <span>💾</span>
    <span>Sayımı Tamamla ve Stokları Güncelle</span>
  </button>
</div>
