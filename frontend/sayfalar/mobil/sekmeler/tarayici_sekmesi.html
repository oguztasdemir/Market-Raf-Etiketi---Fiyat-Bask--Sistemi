<main class="container" id="section-scan" style="display: none;">

    <!-- 📷 Canlı Kamera & ⚡ Hızlı Ürün Ekle Butonları -->
    <div class="scan-actions-grid">
      <button class="btn-action-camera" onclick="openFullscreenCamera()">
        <span style="font-size: 20px;">📷</span>
        <span>Kamera Aç</span>
      </button>

      <button class="btn-action-gallery" onclick="openMobileQuickProductModal()" style="background: linear-gradient(135deg, rgba(245,158,11,0.18), rgba(217,119,6,0.25)); border-color: rgba(245,158,11,0.5); color: #f59e0b;">
        <span style="font-size: 20px;">⚡</span>
        <span>Hızlı Ürün</span>
      </button>
    </div>

    <!-- Manuel Barkod Giriş Satırı -->
    <div class="manual-barcode-bar">
      <input type="text" id="inp-manual-barcode" placeholder="Barkod veya ürün adı ara..." onkeydown="if(event.key==='Enter') lookupBarcode(this.value)">
      <button onclick="lookupBarcode(document.getElementById('inp-manual-barcode').value)">Bul</button>
    </div>

    <!-- Bildirim Kutusu (Toast) -->
    <div id="toast" class="toast-box"></div>

    <!-- Son Eklenen Ürün Başarı Kartı (Listeye ekle dedikten sonra kamera yerine gösterilir) -->
    <div id="added-success-card" class="empty-state-card" style="display: none; border-color: rgba(16, 185, 129, 0.4); background: rgba(16, 185, 129, 0.08); padding: 20px 16px;">
      <div class="empty-icon" style="font-size: 36px; margin-bottom: 2px;">✅</div>
      <div class="empty-title" id="added-success-title" style="color: #34d399; font-size: 15.5px; font-weight: 800;">Ürün başarıyla listeye eklendi!</div>
      <div class="empty-desc" id="added-success-desc" style="color: #e2e8f0; margin-top: 4px; font-size: 12.5px;"></div>
      <div style="margin-top: 14px; display: flex; gap: 8px; width: 100%;">
        <button class="btn-action-camera" style="flex: 1; padding: 11px 8px; font-size: 13px;" onclick="openFullscreenCamera()">
          <span>📷</span>
          <span>Sıradaki Barkodu Oku</span>
        </button>
        <button class="btn-action-gallery" style="flex: 1; padding: 11px 8px; font-size: 13px;" onclick="switchMobileTab('queue')">
          <span>📋</span>
          <span id="added-badge-count-text">Listeyi Gör</span>
        </button>
      </div>
    </div>

    <!-- Boş Durum Karşılama Kartı -->
    <div id="empty-state" class="empty-state-card">
      <div class="empty-icon">🏷️</div>
      <div class="empty-title">Barkod Okutulması Bekleniyor</div>
      <div class="empty-desc"><strong>"Kamera Aç"</strong> butonuna basın; tam ekran kamera açılacak ve barkodu kırmızı çizgiye getirdiğiniz anda <strong>fotoğraf çekmeden</strong> fiyatı ekrana getirecektir.</div>
    </div>

    <!-- Okunan Ürün Kartı -->
    <div id="product-card" class="product-info-card">
      <div class="card-header-row">
        <span id="txt-barcode" class="product-barcode-badge">8690000000000</span>
        <span id="badge-status" class="product-status-pill found">✓ Kayıtlı Ürün</span>
      </div>

      <div class="field-group">
        <label class="field-label">Ürün Adı</label>
        <input type="text" id="inp-title" class="inp-title-box" placeholder="Ürün adını girin...">
      </div>

      <div class="price-edit-box">
        <div class="price-label-row">
          <span>🏷️ SATIŞ FİYATI</span>
          <small style="color:var(--text-muted); font-size:10.5px;">(Değiştirebilirsiniz)</small>
        </div>
        <input type="text" id="inp-price" class="price-input-large" placeholder="0,00 TL">
      </div>

      <!-- LİSTEYE EKLE BUTONU -->
      <button id="btn-add-queue" class="btn-add-queue" onclick="addItemToQueue()">
        <span style="font-size: 18px;">➕</span>
        <span>LİSTEYE EKLE</span>
      </button>

      <button class="btn-next-scan" onclick="prepareForNextScan()">
        📷 Sıradaki Ürünü Okut
      </button>
    </div>

  </main>
