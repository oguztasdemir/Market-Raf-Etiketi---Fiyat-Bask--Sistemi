<main class="container" id="section-scan" style="display: none;">

    <!-- 📷 Canlı Kamera Düğmesi -->
    <div style="margin-bottom: 12px;">
      <button class="btn-action-camera" onclick="openFullscreenCamera()" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; padding: 16px;">
        <span style="font-size: 24px;">📷</span>
        <span style="font-size: 16px;">BARKOD OKUT / TARA</span>
      </button>
    </div>

    <!-- Manuel Barkod Giriş Satırı -->
    <div class="manual-barcode-bar">
      <input type="text" id="inp-manual-barcode" placeholder="Barkod veya ürün adı ara..." onkeydown="if(event.key==='Enter') lookupBarcode(this.value)">
      <button onclick="lookupBarcode(document.getElementById('inp-manual-barcode').value)">Bul</button>
    </div>

    <!-- Bildirim Kutusu (Toast) -->
    <div id="toast" class="toast-box"></div>

    <!-- Son Eklenen Ürün Başarı Kartı (Listeye ekle dedikten sonra kamera yerine gösterilir) -->
    <div id="added-success-card" class="empty-state-card" style="display: none; border-color: rgba(16, 185, 129, 0.4); background: rgba(16, 185, 129, 0.08); padding: 20px 16px;">
      <div class="empty-icon" style="font-size: 36px; margin-bottom: 2px;">✅</div>
      <div class="empty-title" id="added-success-title" style="color: #34d399; font-size: 15.5px; font-weight: 800;">Ürün başarıyla listeye eklendi!</div>
      <div class="empty-desc" id="added-success-desc" style="color: #e2e8f0; margin-top: 4px; font-size: 12.5px;"></div>
      <div style="margin-top: 14px; display: flex; gap: 8px; width: 100%;">
        <button class="btn-action-camera" style="flex: 1.2; padding: 11px 6px; font-size: 12.5px;" onclick="openFullscreenCamera()">
          <span>📷</span>
          <span>Sıradaki Barkod</span>
        </button>
        <button class="btn-action-gallery" style="flex: 0.9; padding: 11px 6px; font-size: 12.5px; background: rgba(59, 130, 246, 0.15); border-color: rgba(59, 130, 246, 0.4); color: #60a5fa;" onclick="editLastAddedProduct()">
          <span>✏️</span>
          <span>Düzenle</span>
        </button>
        <button class="btn-action-gallery" style="flex: 1.1; padding: 11px 6px; font-size: 12.5px;" onclick="switchMobileTab('queue')">
          <span>📋</span>
          <span id="added-badge-count-text">Listeyi Gör</span>
        </button>
      </div>
    </div>

    <!-- Boş Durum Karşılama Kartı -->
    <div id="empty-state" class="empty-state-card">
      <div class="empty-icon">🏷️</div>
      <div class="empty-title">Barkod Okutulması Bekleniyor</div>
      <div class="empty-desc"><strong>"Barkod Okut / Tara"</strong> butonuna basın veya yukarıdaki arama kutusuna yazın. Kamera açılınca barkodu kırmızı çizgiye getirin.</div>
    </div>

    <!-- Okunan Ürün Kartı -->
    <div id="product-card" class="product-info-card">
      <div class="card-header-row">
        <span id="txt-barcode" class="product-barcode-badge">8690000000000</span>
        <span id="badge-status" class="product-status-pill found">✓ Kayıtlı Ürün</span>
      </div>

      <div class="field-group">
        <label class="field-label">Ürün Adı</label>
        <input type="text" id="inp-title" class="inp-title-box" placeholder="Ürün adını girin...">
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div class="field-group">
          <label class="field-label">Marka</label>
          <input type="text" id="inp-brand" class="inp-title-box" placeholder="Marka girin..." style="padding: 9px 12px; font-size: 13px;">
        </div>
        <div class="field-group">
          <label class="field-label">KDV Oranı (%)</label>
          <input type="number" id="inp-vat" class="inp-title-box" placeholder="10" style="padding: 9px 12px; font-size: 13px;">
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div class="field-group">
          <label class="field-label">Alış Fiyatı</label>
          <input type="text" id="inp-buy-price" class="inp-title-box" placeholder="0,00" style="padding: 9px 12px; font-size: 13px; color: #fbbf24; font-weight: 700;">
        </div>
        <div class="field-group">
          <label class="field-label">Satış Fiyatı</label>
          <input type="text" id="inp-price" class="inp-title-box" placeholder="0,00" style="padding: 9px 12px; font-size: 13px; color: #34d399; font-weight: 700;">
        </div>
      </div>

      <!-- LİSTEYE EKLE BUTONU -->
      <button id="btn-add-queue" class="btn-add-queue" onclick="addItemToQueue()">
        <span style="font-size: 18px;">➕</span>
        <span>LİSTEYE EKLE</span>
      </button>

      <button class="btn-next-scan" onclick="prepareForNextScan()">
        📷 Sıradaki Ürünü Okut
      </button>
    </div>

  </main>
