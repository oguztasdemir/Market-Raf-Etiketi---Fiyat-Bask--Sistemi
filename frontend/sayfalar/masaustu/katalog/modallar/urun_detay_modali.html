<!-- =========================================================
     MODAL: KATALOG ÜRÜN DETAYI & DÜZENLEME (KOMPAKT & SCROLLSUZ TAM EKRAN UYUMLU DÜZEN)
     ========================================================= -->
<div id="modal-catalog-product-detail" class="modal-backdrop" style="position: fixed; inset: 0; background: rgba(5, 10, 20, 0.88); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 99999999; padding: 12px; box-sizing: border-box;">
  <div class="modal-card" style="max-width: 820px; width: 96%; background: #0f172a; border: 1.5px solid rgba(56,189,248,0.35); border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.85); overflow: hidden; display: flex; flex-direction: column;">
    
    <!-- Başlık Çubuğu -->
    <div class="modal-header" style="background: #1e293b; padding: 10px 18px; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-between; align-items: center;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="width: 32px; height: 32px; border-radius: 7px; background: rgba(56,189,248,0.15); border: 1px solid rgba(56,189,248,0.35); display: flex; align-items: center; justify-content: center; font-size: 16px;">
          📦
        </div>
        <div>
          <h3 style="margin: 0; font-size: 15px; font-weight: 800; color: #f8fafc;">Ürün Detayı & Düzenleme</h3>
          <span id="cat-detail-barcode-badge" class="barcode-text" style="font-size: 11.5px; color: #38bdf8; font-family: monospace; font-weight: 700;"></span>
        </div>
      </div>
      <input type="hidden" id="cat-detail-inp-barcode" value="">
      <button class="modal-close-btn" onclick="closeCatalogProductDetailModal()" style="background: #334155; border: 1px solid #475569; border-radius: 6px; color: #cbd5e1; font-size: 15px; cursor: pointer; padding: 3px 9px; line-height: 1;">✕</button>
    </div>

    <!-- Gövde (Scrollsuz, Kompakt & Kusursuz Sığan Düzen) -->
    <div class="modal-body" style="padding: 12px 18px; display: flex; flex-direction: column; gap: 9px; overflow: hidden;">
      
      <!-- 1. ÇOKLU BARKOD YÖNETİMİ KARTI -->
      <div style="background: #090e1a; border: 1px solid rgba(56,189,248,0.25); border-radius: 8px; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <label style="font-size: 11px; font-weight: 800; color: #38bdf8; text-transform: uppercase; margin: 0; display: flex; align-items: center; gap: 5px;">
            <span>🏷️</span> Ürün Barkodları (Çoklu Barkod Listesi)
          </label>
          <span id="cat-detail-barcodes-count-badge" style="font-size: 10.5px; color: #38bdf8; font-weight: 800; background: rgba(56,189,248,0.12); border: 1px solid rgba(56,189,248,0.3); padding: 1px 7px; border-radius: 4px;">
            1 Kayıtlı Barkod
          </span>
        </div>

        <!-- Kayıtlı Barkodlar Çip/Rozet Listesi -->
        <div id="cat-detail-barcodes-chips-container" style="display: flex; flex-wrap: wrap; gap: 5px; min-height: 24px; align-items: center;">
          <!-- Dinamik JS çipleri buraya render edilir -->
        </div>

        <!-- Yeni Barkod Ekleme Girişi -->
        <div style="display: flex; gap: 6px;">
          <input type="text" id="cat-detail-inp-new-barcode" placeholder="Yeni barkod yaz veya okut..." onkeydown="if(event.key==='Enter') addBarcodeToCurrentDetailProduct()" style="flex: 1; padding: 6px 10px; background: #0f172a; border: 1.5px dashed rgba(56,189,248,0.45); border-radius: 6px; color: #38bdf8; font-family: monospace; font-size: 12px; font-weight: 700; outline: none;">
          <button type="button" onclick="generateInternalBarcodeForDetail()" style="padding: 6px 10px; font-size: 11px; font-weight: 800; background: linear-gradient(135deg, #8b5cf6, #6d28d9); white-space: nowrap; cursor: pointer; border-radius: 6px; border: none; color: #fff; display: flex; align-items: center; gap: 4px;" title="Barkodsuz ürünler için otomatik mağaza içi EAN-13 barkod üretir">
            <span>⚡</span> Barkod Üret
          </button>
          <button type="button" class="btn-primary" onclick="addBarcodeToCurrentDetailProduct()" style="padding: 6px 14px; font-size: 11px; font-weight: 800; background: linear-gradient(135deg, #0284c7, #0369a1); white-space: nowrap; cursor: pointer; border-radius: 6px; border: none; color: #fff; display: flex; align-items: center; gap: 4px;">
            <span>➕</span> Barkod Ekle
          </button>
        </div>
      </div>

      <!-- 2. ÜRÜN ADI -->
      <div class="form-group" style="margin: 0;">
        <label style="font-size: 10.5px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 2px; display: block;">Ürün Adı</label>
        <input type="text" id="cat-detail-inp-title" placeholder="Ürün adını girin..." style="width: 100%; padding: 7px 10px; background: #090e1a; border: 1px solid #334155; border-radius: 6px; color: #f8fafc; font-size: 12.5px; font-weight: 700; outline: none; box-sizing: border-box;">
      </div>

      <!-- 3. İKİ SÜTUNLU YAN YANA KOMPAKT DÜZEN -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        
        <!-- SOL SÜTUN: Marka, Menşei & KDV, Stok -->
        <div style="display: flex; flex-direction: column; gap: 8px;">
          
          <div class="form-group" style="margin: 0;">
            <label style="font-size: 10.5px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 2px; display: block;">Marka / Üretici Firma</label>
            <input type="text" id="cat-detail-inp-brand" placeholder="Marka adı..." style="width: 100%; padding: 6px 10px; background: #090e1a; border: 1px solid #334155; border-radius: 6px; color: #f8fafc; font-size: 12px; font-weight: 600; outline: none; box-sizing: border-box;">
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <div class="form-group" style="margin: 0;">
              <label style="font-size: 10.5px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 2px; display: block;">Menşei Ülke</label>
              <input type="text" id="cat-detail-inp-origin" value="TÜRKİYE" style="width: 100%; padding: 6px 10px; background: #090e1a; border: 1px solid #334155; border-radius: 6px; color: #f8fafc; font-size: 12px; font-weight: 600; outline: none; box-sizing: border-box;">
            </div>
            <div class="form-group" style="margin: 0;">
              <label style="font-size: 10.5px; font-weight: 700; color: #fbbf24; text-transform: uppercase; margin-bottom: 2px; display: block;">KDV Oranı (%)</label>
              <input type="number" id="cat-detail-inp-kdv" placeholder="10" value="10" min="0" max="100" style="width: 100%; padding: 6px 10px; background: #090e1a; border: 1px solid #334155; border-radius: 6px; color: #fbbf24; font-size: 12px; font-weight: 700; outline: none; box-sizing: border-box;">
            </div>
          </div>

          <div class="form-group" style="margin: 0;">
            <label style="font-size: 10.5px; font-weight: 700; color: #38bdf8; text-transform: uppercase; margin-bottom: 2px; display: block;">📦 Stok Miktarı</label>
            <input type="number" id="cat-detail-inp-stock" placeholder="0" value="0" style="width: 100%; padding: 6px 10px; background: #090e1a; border: 1px solid #334155; border-radius: 6px; color: #38bdf8; font-size: 12px; font-weight: 700; outline: none; box-sizing: border-box;">
          </div>

        </div>

        <!-- SAĞ SÜTUN: Satış Fiyatı, Raf Etiketi Fiyatı & Etiket Durumu -->
        <div style="display: flex; flex-direction: column; gap: 8px;">
          
          <div class="form-group" style="margin: 0;">
            <label style="font-size: 10.5px; font-weight: 700; color: #38bdf8; text-transform: uppercase; margin-bottom: 2px; display: block;">💰 Güncel Satış Fiyatı</label>
            <input type="text" id="cat-detail-inp-price" placeholder="Örn: 25,00 TL" oninput="onDetailPriceInputChange()" style="width: 100%; padding: 6px 10px; background: #090e1a; border: 1.5px solid #38bdf8; border-radius: 6px; color: #38bdf8; font-size: 14px; font-weight: 800; outline: none; box-sizing: border-box;">
          </div>

          <div class="form-group" style="margin: 0;">
            <label style="font-size: 10.5px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 2px; display: block;">🏷️ Basılı Raf Etiketi Fiyatı</label>
            <div id="cat-detail-label-price-box" style="background: #090e1a; border: 1px solid #334155; border-radius: 6px; padding: 6px 10px; font-size: 12.5px; font-weight: 800; color: #94a3b8; display: flex; align-items: center; justify-content: space-between;">
              <span id="cat-detail-label-price-val">-</span>
              <small id="cat-detail-diff-pill" style="font-size: 10.5px; font-weight: 700;"></small>
            </div>
          </div>

          <div class="form-group" style="margin: 0;">
            <label style="font-size: 10.5px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 2px; display: block;">Etiket Durumu</label>
            <div id="cat-detail-status-box" style="background: #090e1a; border: 1px solid #334155; border-radius: 6px; padding: 6px 10px; display: flex; justify-content: space-between; align-items: center; font-size: 11.5px;">
              <span style="color: #94a3b8;">Raf Etiketi:</span>
              <span id="cat-detail-status-text" style="font-weight: 700;">-</span>
            </div>
          </div>

          <!-- Gizli Muafiyet Inputu (JS Uyumluluğu İçin) -->
          <input type="checkbox" id="cat-detail-check-no-label" style="display: none;">

        </div>

      </div>

      <!-- 4. ÖZEL KATEGORİ (HIZLI SATIŞ & ÖZEL ÜRÜN LİSTESİ) -->
      <div style="background: rgba(168,85,247,0.08); border: 1px solid rgba(168,85,247,0.3); border-radius: 8px; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="width: 28px; height: 28px; border-radius: 6px; background: rgba(168,85,247,0.18); border: 1px solid rgba(168,85,247,0.4); display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0;">
            ⭐
          </div>
          <div>
            <div style="font-size: 11.5px; font-weight: 800; color: #d8b4fe;">Özel Kategori (Hızlı Satış Listesi)</div>
            <div style="font-size: 10px; color: #94a3b8;">Bu ürünü Özel Kategori filtre listesine ve hızlı erişim tuşlarına ekler.</div>
          </div>
        </div>
        <div>
          <button type="button" id="btn-detail-toggle-special-cat" onclick="toggleDetailProductSpecialCategory()" style="padding: 5px 12px; border-radius: 6px; font-weight: 800; font-size: 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; transition: all 0.15s; border: none; background: #1e293b; color: #94a3b8;">
            <span>➕</span> Özel Kategoriye Ekle
          </button>
          <input type="hidden" id="cat-detail-inp-is-special" value="false">
        </div>
      </div>

    </div>

    <!-- Alt Butonlar -->
    <div class="modal-footer" style="padding: 9px 18px; background: #1e293b; border-top: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap;">
      <div style="display: flex; gap: 6px;">
        <button type="button" class="btn-secondary" style="color: #38bdf8; border-color: rgba(56,189,248,0.4); background: rgba(56,189,248,0.1); font-weight: 700; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 11.5px; display: flex; align-items: center; gap: 4px;" onclick="pinCurrentDetailToQuickButtons()" title="Bu ürünü Hızlı Satış ekranına özel barkod tuşu olarak ekle">
          <span>⚡</span> Hızlı Satışa Ekle
        </button>
        <button type="button" class="btn-secondary" style="color: #c084fc; border-color: rgba(192,132,252,0.4); background: rgba(192,132,252,0.12); font-weight: 800; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 11.5px; display: flex; align-items: center; gap: 4px;" onclick="openDetailProductActivityHistory()" title="Bu ürünün tüm geçmiş etiket basım, fiyat değişimi ve satış faaliyetlerini gör">
          <span>📜</span> Geçmiş Faaliyetler
        </button>
      </div>
      <div style="display: flex; gap: 6px;">
        <button type="button" class="btn-secondary" onclick="printFromDetailModal()" style="background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.4); color: #38bdf8; font-weight: 700; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11.5px; display: flex; align-items: center; gap: 4px;">
          <span>🖨️</span> Yazdır
        </button>
        <button type="button" class="btn-secondary" onclick="closeCatalogProductDetailModal()" style="background: #334155; border: 1px solid #475569; color: #cbd5e1; font-weight: 600; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11.5px;">
          ✕ Çık
        </button>
        <button type="button" class="btn-primary" onclick="submitCatalogProductDetail()" style="background: linear-gradient(135deg, #059669, #047857); border: none; color: #ffffff; font-weight: 800; padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 12px; box-shadow: 0 4px 12px rgba(16,185,129,0.35); display: flex; align-items: center; gap: 5px;">
          <span>💾</span> Güncelle & Kaydet
        </button>
      </div>
    </div>

  </div>
</div>
