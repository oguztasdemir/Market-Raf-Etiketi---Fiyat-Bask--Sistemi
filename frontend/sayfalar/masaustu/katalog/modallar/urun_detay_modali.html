<!-- =========================================================
     MODAL: KATALOG ÜRÜN DETAYI & DÜZENLEME (KOMPAKT & SCROLLSUZ TAM EKRAN UYUMLU DÜZEN)
     ========================================================= -->
<div id="modal-catalog-product-detail" class="modal-backdrop" style="position: fixed; inset: 0; background: rgba(3, 7, 18, 0.82); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: none; align-items: center; justify-content: center; z-index: 99999999; padding: 16px; box-sizing: border-box;">
  <div class="modal-card" style="max-width: 780px; width: 100%; background: #0b1329; border: 1px solid rgba(56,189,248,0.25); border-radius: 16px; box-shadow: 0 25px 60px -12px rgba(0,0,0,0.85), 0 0 1px 1px rgba(255,255,255,0.05); overflow: hidden; display: flex; flex-direction: column;">
    
    <!-- Başlık Çubuğu -->
    <div class="modal-header" style="background: linear-gradient(90deg, #0f172a 0%, #1e293b 100%); padding: 14px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-between; align-items: center;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 38px; height: 38px; border-radius: 10px; background: rgba(56,189,248,0.12); border: 1px solid rgba(56,189,248,0.3); display: flex; align-items: center; justify-content: center; font-size: 18px; box-shadow: 0 2px 8px rgba(56,189,248,0.15);">
          📦
        </div>
        <div>
          <h3 style="margin: 0; font-size: 15.5px; font-weight: 800; color: #f8fafc; letter-spacing: -0.01em;">Ürün Detayı & Düzenleme</h3>
          <div style="display: flex; align-items: center; gap: 6px; margin-top: 2px;">
            <span style="font-size: 11px; color: #64748b; font-weight: 600;">Barkod:</span>
            <span id="cat-detail-barcode-badge" class="barcode-text" style="font-size: 12px; color: #38bdf8; font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; font-weight: 800; letter-spacing: 0.5px;"></span>
          </div>
        </div>
      </div>
      <button class="modal-close-btn" onclick="closeCatalogProductDetailModal()" style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #94a3b8; font-size: 14px; cursor: pointer; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; transition: all 0.15s ease;" onmouseover="this.style.background='rgba(239,68,68,0.2)'; this.style.color='#f87171'; this.style.borderColor='rgba(239,68,68,0.3)';" onmouseout="this.style.background='rgba(255,255,255,0.06)'; this.style.color='#94a3b8'; this.style.borderColor='rgba(255,255,255,0.1)';">✕</button>
    </div>

    <!-- Gövde -->
    <div class="modal-body" style="padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; background: #070d1e;">
      
      <!-- 1. & 2. BARKOD & ÜRÜN ADI ÜST KART -->
      <div style="background: #0f172a; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: 1.1fr 2fr; gap: 12px; align-items: center;">
        <div class="form-group" style="margin: 0;">
          <label style="font-size: 11px; font-weight: 700; color: #38bdf8; margin-bottom: 4px; display: flex; align-items: center; gap: 5px;">
            <span>🏷️</span> <span>Ürün Barkodu (Tekil)</span>
          </label>
          <input type="text" id="cat-detail-inp-barcode" placeholder="Barkodu yazın veya okutun..." style="width: 100%; padding: 8px 12px; background: #070c18; border: 1.5px solid rgba(56,189,248,0.3); border-radius: 8px; color: #38bdf8; font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; font-size: 13px; font-weight: 800; outline: none; box-sizing: border-box;">
        </div>

        <div class="form-group" style="margin: 0;">
          <label style="font-size: 11px; font-weight: 700; color: #cbd5e1; margin-bottom: 4px; display: flex; align-items: center; gap: 5px;">
            <span>📝</span> <span>Ürün Adı & Tanımı</span>
          </label>
          <input type="text" id="cat-detail-inp-title" placeholder="Ürün adını girin..." style="width: 100%; padding: 8px 12px; background: #070c18; border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; color: #ffffff; font-size: 13px; font-weight: 700; outline: none; box-sizing: border-box;">
        </div>
      </div>

      <!-- 3. İKİ SÜTUNLU AYRINTILI BİLGİ KARTLARI -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        
        <!-- SOL SÜTUN: Marka, Menşei, KDV, Stok -->
        <div style="background: #0f172a; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;">
          <div style="font-size: 11.5px; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 6px; display: flex; align-items: center; gap: 6px;">
            <span>🏢</span> <span>Üretici & Stok Bilgileri</span>
          </div>

          <div class="form-group" style="margin: 0;">
            <label style="font-size: 10.5px; font-weight: 700; color: #94a3b8; margin-bottom: 3px; display: block;">Marka / Üretici Firma</label>
            <input type="text" id="cat-detail-inp-brand" placeholder="Marka adı..." style="width: 100%; padding: 7px 10px; background: #070c18; border: 1px solid rgba(255,255,255,0.1); border-radius: 7px; color: #f8fafc; font-size: 12px; font-weight: 600; outline: none; box-sizing: border-box;">
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <div class="form-group" style="margin: 0;">
              <label style="font-size: 10.5px; font-weight: 700; color: #94a3b8; margin-bottom: 3px; display: block;">Menşei Ülke</label>
              <input type="text" id="cat-detail-inp-origin" value="TÜRKİYE" style="width: 100%; padding: 7px 10px; background: #070c18; border: 1px solid rgba(255,255,255,0.1); border-radius: 7px; color: #f8fafc; font-size: 12px; font-weight: 600; outline: none; box-sizing: border-box;">
            </div>
            <div class="form-group" style="margin: 0;">
              <label style="font-size: 10.5px; font-weight: 700; color: #fbbf24; margin-bottom: 3px; display: block;">KDV Oranı (%)</label>
              <input type="number" id="cat-detail-inp-kdv" placeholder="10" value="10" min="0" max="100" style="width: 100%; padding: 7px 10px; background: #070c18; border: 1px solid rgba(251,191,36,0.3); border-radius: 7px; color: #fbbf24; font-size: 12px; font-weight: 800; outline: none; box-sizing: border-box;">
            </div>
          </div>

          <div class="form-group" style="margin: 0;">
            <label style="font-size: 10.5px; font-weight: 700; color: #38bdf8; margin-bottom: 3px; display: block;">📦 Stok Miktarı</label>
            <input type="number" id="cat-detail-inp-stock" placeholder="0" value="0" style="width: 100%; padding: 7px 10px; background: #070c18; border: 1px solid rgba(56,189,248,0.25); border-radius: 7px; color: #38bdf8; font-size: 12px; font-weight: 800; outline: none; box-sizing: border-box;">
          </div>
        </div>

        <!-- SAĞ SÜTUN: Fiyat & Raf Etiketi Durumu -->
        <div style="background: #0f172a; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;">
          <div style="font-size: 11.5px; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 6px; display: flex; align-items: center; gap: 6px;">
            <span>💰</span> <span>Fiyat & Raf Etiket Kontrolü</span>
          </div>

          <div class="form-group" style="margin: 0;">
            <label style="font-size: 10.5px; font-weight: 800; color: #38bdf8; margin-bottom: 3px; display: flex; justify-content: space-between; align-items: center;">
              <span>💰 Güncel Satış Fiyatı</span>
              <span style="font-size: 10px; color: #64748b; font-weight: 600;">(Kasa / POS Satış)</span>
            </label>
            <input type="text" id="cat-detail-inp-price" placeholder="Örn: 25,00 TL" oninput="onDetailPriceInputChange()" style="width: 100%; padding: 7px 12px; background: #070c18; border: 1.5px solid #0284c7; border-radius: 7px; color: #38bdf8; font-size: 14.5px; font-weight: 900; outline: none; box-sizing: border-box;">
          </div>

          <div class="form-group" style="margin: 0;">
            <label style="font-size: 10.5px; font-weight: 700; color: #94a3b8; margin-bottom: 3px; display: block;">🏷️ Basılı Raf Etiketi Fiyatı</label>
            <div id="cat-detail-label-price-box" style="background: #070c18; border: 1px solid rgba(255,255,255,0.08); border-radius: 7px; padding: 7px 10px; font-size: 12.5px; font-weight: 800; color: #94a3b8; display: flex; align-items: center; justify-content: space-between;">
              <span id="cat-detail-label-price-val">-</span>
              <small id="cat-detail-diff-pill" style="font-size: 10.5px; font-weight: 700;"></small>
            </div>
          </div>

          <div class="form-group" style="margin: 0;">
            <label style="font-size: 10.5px; font-weight: 700; color: #94a3b8; margin-bottom: 3px; display: block;">Etiket Durumu</label>
            <div id="cat-detail-status-box" style="background: #070c18; border: 1px solid rgba(255,255,255,0.08); border-radius: 7px; padding: 7px 10px; display: flex; justify-content: space-between; align-items: center; font-size: 11.5px;">
              <span style="color: #64748b; font-weight: 600;">Raf Etiketi:</span>
              <span id="cat-detail-status-text" style="font-weight: 700;">-</span>
            </div>
          </div>

          <!-- Gizli Muafiyet Inputu -->
          <input type="checkbox" id="cat-detail-check-no-label" style="display: none;">
        </div>

      </div>

      <!-- 4. ÖZEL KATEGORİ (HIZLI SATIŞ & ÖZEL ÜRÜN LİSTESİ) -->
      <div style="background: linear-gradient(135deg, rgba(168,85,247,0.08) 0%, rgba(99,102,241,0.06) 100%); border: 1px solid rgba(168,85,247,0.25); border-radius: 12px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="width: 32px; height: 32px; border-radius: 8px; background: rgba(168,85,247,0.18); border: 1px solid rgba(168,85,247,0.35); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;">
            ⭐
          </div>
          <div>
            <div style="font-size: 12px; font-weight: 800; color: #d8b4fe;">Özel Kategori (Hızlı Satış Listesi)</div>
            <div style="font-size: 10.5px; color: #94a3b8;">Bu ürünü Özel Kategori listesine ve hızlı erişim tuşlarına ekler.</div>
          </div>
        </div>
        <div>
          <button type="button" id="btn-detail-toggle-special-cat" onclick="toggleDetailProductSpecialCategory()" style="padding: 6px 14px; border-radius: 8px; font-weight: 800; font-size: 11.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: all 0.15s; border: 1px solid rgba(255,255,255,0.1); background: #1e293b; color: #cbd5e1;">
            <span>➕</span> Özel Kategoriye Ekle
          </button>
          <input type="hidden" id="cat-detail-inp-is-special" value="false">
        </div>
      </div>

    </div>

    <!-- Alt Butonlar -->
    <div class="modal-footer" style="padding: 12px 20px; background: #0f172a; border-top: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;">
      <div style="display: flex; gap: 8px;">
        <button type="button" class="btn-secondary" style="color: #38bdf8; border-color: rgba(56,189,248,0.35); background: rgba(56,189,248,0.1); font-weight: 700; padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 5px;" onclick="pinCurrentDetailToQuickButtons()" title="Bu ürünü Hızlı Satış ekranına özel barkod tuşu olarak ekle">
          <span>⚡</span> Hızlı Satışa Ekle
        </button>
        <button type="button" class="btn-secondary" style="color: #f87171; border-color: rgba(239,68,68,0.35); background: rgba(239,68,68,0.1); font-weight: 800; padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 5px;" onclick="deleteCatalogProductFromDetail()" title="Bu ürünü katalogdan tamamen sil">
          <span>🗑️</span> Ürünü Sil
        </button>
        <button type="button" class="btn-secondary" style="color: #c084fc; border-color: rgba(192,132,252,0.35); background: rgba(192,132,252,0.1); font-weight: 800; padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 5px;" onclick="openDetailProductActivityHistory()" title="Bu ürünün tüm geçmiş etiket basım, fiyat değişimi ve satış faaliyetlerini gör">
          <span>📜</span> Geçmiş Faaliyetler
        </button>
      </div>
      <div style="display: flex; gap: 8px;">
        <button type="button" class="btn-secondary" onclick="printFromDetailModal()" style="background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.4); color: #38bdf8; font-weight: 800; padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 5px;">
          <span>🖨️</span> Yazdır
        </button>
        <button type="button" class="btn-secondary" onclick="closeCatalogProductDetailModal()" style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: #cbd5e1; font-weight: 700; padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 12px;">
          ✕ Çık
        </button>
        <button type="button" class="btn-primary" onclick="submitCatalogProductDetail()" style="background: linear-gradient(135deg, #059669, #047857); border: none; color: #ffffff; font-weight: 800; padding: 7px 18px; border-radius: 8px; cursor: pointer; font-size: 12.5px; box-shadow: 0 4px 14px rgba(16,185,129,0.35); display: flex; align-items: center; gap: 6px;">
          <span>💾</span> Güncelle & Kaydet
        </button>
      </div>
    </div>

  </div>
</div>
