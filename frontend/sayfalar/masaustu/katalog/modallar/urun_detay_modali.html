<!-- =========================================================
     MODAL: KATALOG ÜRÜN DETAYI & DÜZENLEME (TAM EKRAN DESTEĞİ VE STOK GİRİŞİ)
     ========================================================= -->
<div id="modal-catalog-product-detail" class="modal-backdrop" style="position: fixed; inset: 0; background: rgba(5, 10, 20, 0.85); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; z-index: 99999999; padding: 20px; box-sizing: border-box;">
  <div class="modal-card" style="max-width: 540px; width: 95%; background: #111827; border: 1px solid #374151; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); overflow: hidden; display: flex; flex-direction: column;">
    
    <!-- Başlık Çubuğu -->
    <div class="modal-header" style="background: #1f2937; padding: 12px 18px; border-bottom: 1px solid #374151; display: flex; justify-content: space-between; align-items: center;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="font-size: 20px;">📦</span>
        <div>
          <h3 style="margin: 0; font-size: 15px; font-weight: 700; color: #f3f4f6;">Ürün Detayı & Düzenleme</h3>
          <span id="cat-detail-barcode-badge" class="barcode-text" style="font-size: 11.5px; color: #38bdf8; font-family: monospace;"></span>
        </div>
      </div>
      <button class="modal-close-btn" onclick="closeCatalogProductDetailModal()" style="background: transparent; border: none; color: #9ca3af; font-size: 18px; cursor: pointer;">✕</button>
    </div>

    <!-- Gövde -->
    <div class="modal-body" style="padding: 16px 18px; display: flex; flex-direction: column; gap: 12px;">
      
      <!-- Barkod & Özel / Ek Barkod Numarası -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div class="form-group">
          <label style="font-size: 11px; font-weight: 700; color: #9ca3af; text-transform: uppercase; margin-bottom: 4px; display: block;">Ana Barkod</label>
          <div style="display: flex; gap: 6px;">
            <input type="text" id="cat-detail-inp-barcode" readonly style="background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 7px 10px; color: #38bdf8; font-family: monospace; font-weight: 700; cursor: default; flex: 1; font-size: 12.5px;">
            <button type="button" class="btn-secondary" onclick="copyDetailBarcode()" style="padding: 0 10px; background: #1e293b; border: 1px solid #334155; color: #f8fafc; border-radius: 6px; cursor: pointer;" title="Barkodu Kopyala">📋</button>
          </div>
        </div>
        <div class="form-group">
          <label style="font-size: 11px; font-weight: 700; color: #a855f7; text-transform: uppercase; margin-bottom: 4px; display: block;">🏷️ Özel / Ek Barkod (Opsiyonel)</label>
          <input type="text" id="cat-detail-inp-custom-barcode" placeholder="Örn: 9901 veya KSA-1" style="width: 100%; padding: 7px 10px; background: #0f172a; border: 1.5px dashed #a855f7; border-radius: 6px; color: #d8b4fe; font-family: monospace; font-size: 12.5px; font-weight: 700; outline: none; box-sizing: border-box;">
        </div>
      </div>

      <!-- Ürün Adı -->
      <div class="form-group">
        <label style="font-size: 11px; font-weight: 700; color: #9ca3af; text-transform: uppercase; margin-bottom: 4px; display: block;">Ürün Adı</label>
        <input type="text" id="cat-detail-inp-title" placeholder="Ürün adını girin..." style="width: 100%; padding: 8px 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #f8fafc; font-size: 13px; font-weight: 600; outline: none; box-sizing: border-box;">
      </div>

      <!-- Marka & Fiyat -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div class="form-group">
          <label style="font-size: 11px; font-weight: 700; color: #9ca3af; text-transform: uppercase; margin-bottom: 4px; display: block;">Marka / Firma</label>
          <input type="text" id="cat-detail-inp-brand" placeholder="Marka adı..." style="width: 100%; padding: 8px 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #f8fafc; font-size: 13px; font-weight: 600; outline: none; box-sizing: border-box;">
        </div>
        <div class="form-group">
          <label style="font-size: 11px; font-weight: 700; color: #38bdf8; text-transform: uppercase; margin-bottom: 4px; display: block;">💰 Satış Fiyatı</label>
          <input type="text" id="cat-detail-inp-price" placeholder="Örn: 25,00 TL" oninput="onDetailPriceInputChange()" style="width: 100%; padding: 8px 10px; background: #0f172a; border: 1.5px solid #38bdf8; border-radius: 6px; color: #38bdf8; font-size: 14px; font-weight: 800; outline: none; box-sizing: border-box;">
        </div>
      </div>

      <!-- Basılı Raf Etiketi Fiyatı -->
      <div class="form-group">
        <label style="font-size: 11px; font-weight: 700; color: #9ca3af; text-transform: uppercase; margin-bottom: 4px; display: block;">🏷️ Basılı Raf Etiketi Fiyatı</label>
        <div id="cat-detail-label-price-box" style="background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 7px 12px; font-size: 13.5px; font-weight: 800; color: #94a3b8; display: flex; align-items: center; justify-content: space-between;">
          <span id="cat-detail-label-price-val">-</span>
          <small id="cat-detail-diff-pill" style="font-size: 11px; font-weight: 700;"></small>
        </div>
      </div>

      <!-- Stok, KDV & Menşei (3 Sütun) -->
      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
        <div class="form-group">
          <label style="font-size: 11px; font-weight: 700; color: #38bdf8; text-transform: uppercase; margin-bottom: 4px; display: block;">📦 Stok</label>
          <input type="number" id="cat-detail-inp-stock" placeholder="0" value="0" style="width: 100%; padding: 8px 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #38bdf8; font-size: 13px; font-weight: 700; outline: none; box-sizing: border-box;">
        </div>
        <div class="form-group">
          <label style="font-size: 11px; font-weight: 700; color: #fbbf24; text-transform: uppercase; margin-bottom: 4px; display: block;">KDV (%)</label>
          <input type="number" id="cat-detail-inp-kdv" placeholder="10" value="10" min="0" max="100" style="width: 100%; padding: 8px 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fbbf24; font-size: 13px; font-weight: 700; outline: none; box-sizing: border-box;">
        </div>
        <div class="form-group">
          <label style="font-size: 11px; font-weight: 700; color: #9ca3af; text-transform: uppercase; margin-bottom: 4px; display: block;">Menşei</label>
          <input type="text" id="cat-detail-inp-origin" value="TÜRKİYE" style="width: 100%; padding: 8px 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #f8fafc; font-size: 13px; font-weight: 600; outline: none; box-sizing: border-box;">
        </div>
      </div>

      <!-- Durum Çubuğu -->
      <div id="cat-detail-status-box" style="background: #090d16; border: 1px solid #334155; border-radius: 6px; padding: 7px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 12px;">
        <span style="color: #9ca3af;">Etiket Durumu:</span>
        <span id="cat-detail-status-text" style="font-weight: 700;">-</span>
      </div>

    </div>

    <!-- Alt Butonlar -->
    <div class="modal-footer" style="padding: 12px 18px; background: #1f2937; border-top: 1px solid #374151; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;">
      <div style="display: flex; gap: 6px;">
        <button type="button" class="btn-secondary" style="color: #f87171; border-color: rgba(239,68,68,0.4); background: rgba(239,68,68,0.1); padding: 7px 11px; font-weight: 600; border-radius: 6px; cursor: pointer; font-size: 11.5px;" onclick="blacklistFromDetailModal()" title="Bu ürünü kara listeye ekle">
          🚫 Kara Liste
        </button>
        <button type="button" class="btn-secondary" style="color: #38bdf8; border-color: rgba(56,189,248,0.4); background: rgba(56,189,248,0.1); font-weight: 700; padding: 7px 11px; border-radius: 6px; cursor: pointer; font-size: 11.5px;" onclick="pinCurrentDetailToQuickButtons()" title="Bu ürünü Hızlı Satış ekranına özel barkod tuşu olarak ekle">
          ⚡ Hızlı Satışa Ekle
        </button>
        <button type="button" class="btn-secondary" style="color: #c084fc; border-color: rgba(192,132,252,0.4); background: rgba(192,132,252,0.12); font-weight: 800; padding: 7px 11px; border-radius: 6px; cursor: pointer; font-size: 11.5px;" onclick="openDetailProductActivityHistory()" title="Bu ürünün tüm geçmiş etiket basım, fiyat değişimi ve satış faaliyetlerini gör">
          📜 Geçmiş Faaliyetler
        </button>
      </div>
      <div style="display: flex; gap: 6px;">
        <button type="button" class="btn-secondary" onclick="printFromDetailModal()" style="background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.4); color: #38bdf8; font-weight: 700; padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 12px;">
          🖨️ Yazdır
        </button>
        <button type="button" class="btn-primary" onclick="submitCatalogProductDetail()" style="background: #059669; border: 1px solid #10b981; color: #ffffff; font-weight: 800; padding: 7px 16px; border-radius: 6px; cursor: pointer; font-size: 12px;">
          💾 Güncelle
        </button>
        <button type="button" class="btn-secondary" onclick="closeCatalogProductDetailModal()" style="background: #334155; border: 1px solid #475569; color: #cbd5e1; font-weight: 600; padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 12px;">
          ✕ Çık
        </button>
      </div>
    </div>

  </div>
</div>
