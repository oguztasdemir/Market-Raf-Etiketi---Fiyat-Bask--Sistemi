<!-- =========================================================
     MODAL: ÜRÜN GEÇMİŞ FAALİYETLERİ & İŞLEM GÜNLÜĞÜ (TIMELINE)
     ========================================================= -->
<div id="modal-product-activity-history" class="modal-backdrop" style="position: fixed; inset: 0; background: rgba(5, 10, 20, 0.88); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 999999999; padding: 16px; box-sizing: border-box;">
  <div class="modal-card" style="max-width: 680px; width: 95%; max-height: 90vh; background: #0f172a; border: 1px solid #38bdf8; border-radius: 14px; box-shadow: 0 24px 48px rgba(0,0,0,0.8); overflow: hidden; display: flex; flex-direction: column;">
    
    <!-- Başlık Çubuğu -->
    <div class="modal-header" style="background: linear-gradient(135deg, #1e293b, #0f172a); padding: 14px 20px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="font-size: 22px;">📜</span>
        <div>
          <h3 style="margin: 0; font-size: 15px; font-weight: 800; color: #f8fafc;">Geçmiş Faaliyetler & İşlem Günlüğü</h3>
          <span id="act-history-product-title" style="font-size: 12px; color: #38bdf8; font-weight: 700;">-</span>
        </div>
      </div>
      <button class="modal-close-btn" onclick="closeProductActivityHistoryModal()" style="background: transparent; border: none; color: #94a3b8; font-size: 20px; cursor: pointer; padding: 4px;" title="Kapat">✕</button>
    </div>

    <!-- Ürün Özet Bilgi Kartı -->
    <div style="background: #090d16; padding: 10px 20px; border-bottom: 1px solid #1e293b; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; font-size: 11.5px;">
      <div>
        <span style="color: #94a3b8; display: block; font-size: 10.5px;">BARKOD</span>
        <strong id="act-history-barcode" style="color: #38bdf8; font-family: monospace;">-</strong>
      </div>
      <div>
        <span style="color: #94a3b8; display: block; font-size: 10.5px;">SATIŞ FİYATI</span>
        <strong id="act-history-price" style="color: #34d399;">-</strong>
      </div>
      <div>
        <span style="color: #94a3b8; display: block; font-size: 10.5px;">ETİKET FİYATI</span>
        <strong id="act-history-label-price" style="color: #fbbf24;">-</strong>
      </div>
      <div>
        <span style="color: #94a3b8; display: block; font-size: 10.5px;">MEVCUT STOK</span>
        <strong id="act-history-stock" style="color: #e2e8f0;">-</strong>
      </div>
    </div>

    <!-- Faaliyet Filtre Sekmeleri -->
    <div style="display: flex; gap: 6px; padding: 10px 20px; background: #0f172a; border-bottom: 1px solid #1e293b; overflow-x: auto;">
      <button type="button" class="btn-status-pill active" id="act-tab-all" onclick="filterActivityTimeline('all')" style="padding: 4px 10px; font-size: 11px;">
        Tümü <span id="act-count-all" class="pill-count">0</span>
      </button>
      <button type="button" class="btn-status-pill" id="act-tab-print" onclick="filterActivityTimeline('print')" style="padding: 4px 10px; font-size: 11px;">
        🖨️ Etiket Baskıları <span id="act-count-print" class="pill-count">0</span>
      </button>
      <button type="button" class="btn-status-pill" id="act-tab-price" onclick="filterActivityTimeline('price')" style="padding: 4px 10px; font-size: 11px;">
        💰 Fiyat Değişiklikleri <span id="act-count-price" class="pill-count">0</span>
      </button>
      <button type="button" class="btn-status-pill" id="act-tab-sale" onclick="filterActivityTimeline('sale')" style="padding: 4px 10px; font-size: 11px;">
        🛒 Kasa Satışları <span id="act-count-sale" class="pill-count">0</span>
      </button>
      <button type="button" class="btn-status-pill" id="act-tab-stock" onclick="filterActivityTimeline('stock')" style="padding: 4px 10px; font-size: 11px;">
        📦 Stok & Bilgi <span id="act-count-stock" class="pill-count">0</span>
      </button>
    </div>

    <!-- Zaman Çizelgesi (Timeline Gövdesi) -->
    <div class="modal-body" id="act-history-timeline-container" style="flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; background: #090d16; min-height: 240px; max-height: 420px;">
      <!-- JS Tarafından doldurulacak -->
    </div>

    <!-- Manuel Faaliyet / Not Ekleme & Kapatma Alt Çubuğu -->
    <div class="modal-footer" style="padding: 10px 18px; background: #1e293b; border-top: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; gap: 10px;">
      <div style="display: flex; gap: 6px; flex: 1; max-width: 400px;">
        <input type="text" id="act-history-new-note" placeholder="Ürüne özel not/faaliyet ekle..." style="flex: 1; padding: 6px 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #ffffff; font-size: 12px; outline: none;">
        <button type="button" class="btn-secondary" onclick="submitProductManualActivityNote()" style="padding: 6px 12px; background: rgba(56,189,248,0.15); border-color: rgba(56,189,248,0.4); color: #38bdf8; font-weight: 700; font-size: 11.5px; border-radius: 6px; cursor: pointer; white-space: nowrap;">
          + Not Ekle
        </button>
      </div>
      <button type="button" class="btn-secondary" onclick="closeProductActivityHistoryModal()" style="background: #334155; border: 1px solid #475569; color: #cbd5e1; font-weight: 700; padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 12px;">
        ✕ Kapat
      </button>
    </div>

  </div>
</div>
