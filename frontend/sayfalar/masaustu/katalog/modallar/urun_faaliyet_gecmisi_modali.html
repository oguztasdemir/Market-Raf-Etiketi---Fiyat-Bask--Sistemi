<!-- =========================================================
     MODAL: ÜRÜN GEÇMİŞ FAALİYETLERİ & İŞLEM GÜNLÜĞÜ (TIMELINE)
     ========================================================= -->
<div id="modal-product-activity-history" class="modal-backdrop" style="position: fixed; inset: 0; background: rgba(5, 10, 20, 0.88); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 999999999; padding: 16px; box-sizing: border-box;">
  <div class="modal-card" style="max-width: 800px; width: 95%; max-height: 90vh; background: #0f172a; border: 1.5px solid rgba(56,189,248,0.4); border-radius: 14px; box-shadow: 0 24px 60px rgba(0,0,0,0.85); overflow: hidden; display: flex; flex-direction: column;">
    
    <!-- Başlık Çubuğu -->
    <div class="modal-header" style="background: linear-gradient(135deg, #1e293b, #0f172a); padding: 14px 22px; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-between; align-items: center;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="font-size: 22px;">📜</span>
        <div>
          <h3 style="margin: 0; font-size: 15.5px; font-weight: 800; color: #f8fafc;">Ürün Faaliyet & Fiyat Değişikliği Geçmişi</h3>
          <span id="act-history-product-title" style="font-size: 12px; color: #38bdf8; font-weight: 700;">-</span>
        </div>
      </div>
      <button class="modal-close-btn" onclick="closeProductActivityHistoryModal()" style="background: #334155; border: 1px solid #475569; border-radius: 6px; color: #cbd5e1; font-size: 16px; cursor: pointer; padding: 4px 10px;" title="Kapat">✕</button>
    </div>

    <!-- Ürün Özet Bilgi Kartı -->
    <div style="background: #090e1a; padding: 12px 22px; border-bottom: 1px solid rgba(255,255,255,0.06); display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; font-size: 12px;">
      <div>
        <span style="color: #94a3b8; display: block; font-size: 10.5px; font-weight: 700; text-transform: uppercase;">BARKOD</span>
        <strong id="act-history-barcode" style="color: #38bdf8; font-family: monospace; font-size: 13px;">-</strong>
      </div>
      <div>
        <span style="color: #94a3b8; display: block; font-size: 10.5px; font-weight: 700; text-transform: uppercase;">GÜNCEL SATIŞ FİYATI</span>
        <strong id="act-history-price" style="color: #34d399; font-size: 14px; font-weight: 900;">-</strong>
      </div>
      <div>
        <span style="color: #94a3b8; display: block; font-size: 10.5px; font-weight: 700; text-transform: uppercase;">BASILI RAF ETİKETİ</span>
        <strong id="act-history-label-price" style="color: #fbbf24; font-size: 14px; font-weight: 900;">-</strong>
      </div>
      <div>
        <span style="color: #94a3b8; display: block; font-size: 10.5px; font-weight: 700; text-transform: uppercase;">MEVCUT STOK</span>
        <strong id="act-history-stock" style="color: #e2e8f0; font-size: 13px; font-weight: 800;">-</strong>
      </div>
    </div>

    <!-- Faaliyet Filtre Sekmeleri (TÜMÜ KALDIRILDI, ODAKLI 3 SEKME) -->
    <div style="display: flex; gap: 8px; padding: 10px 22px; background: #0f172a; border-bottom: 1px solid rgba(255,255,255,0.08); overflow-x: auto;">
      <button type="button" class="btn-status-pill active" id="act-tab-price" onclick="filterActivityTimeline('price')" style="padding: 6px 14px; font-size: 12px; font-weight: 800; cursor: pointer; border-radius: 6px;">
        💰 Fiyat Değişiklikleri & Etiketler <span id="act-count-price" class="pill-count" style="margin-left: 4px;">0</span>
      </button>
      <button type="button" class="btn-status-pill" id="act-tab-sale" onclick="filterActivityTimeline('sale')" style="padding: 6px 14px; font-size: 12px; font-weight: 800; cursor: pointer; border-radius: 6px;">
        📅 Günlük Satış Özeti <span id="act-count-sale" class="pill-count" style="margin-left: 4px;">0</span>
      </button>
      <button type="button" class="btn-status-pill" id="act-tab-stock" onclick="filterActivityTimeline('stock')" style="padding: 6px 14px; font-size: 12px; font-weight: 800; cursor: pointer; border-radius: 6px;">
        📝 Manuel Notlar & İşlemler <span id="act-count-stock" class="pill-count" style="margin-left: 4px;">0</span>
      </button>
    </div>

    <!-- Zaman Çizelgesi (Timeline Gövdesi) -->
    <div class="modal-body" id="act-history-timeline-container" style="flex: 1; overflow-y: auto; padding: 18px 22px; display: flex; flex-direction: column; gap: 12px; background: #090e1a; min-height: 260px; max-height: 440px;">
      <!-- JS Tarafından doldurulacak -->
    </div>

    <!-- Manuel Faaliyet / Not Ekleme & Kapatma Alt Çubuğu -->
    <div class="modal-footer" style="padding: 12px 22px; background: #1e293b; border-top: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-between; align-items: center; gap: 12px;">
      <div style="display: flex; gap: 8px; flex: 1; max-width: 480px;">
        <input type="text" id="act-history-new-note" placeholder="Ürüne özel not veya açıklama ekle..." style="flex: 1; padding: 8px 12px; background: #090e1a; border: 1px solid #334155; border-radius: 6px; color: #ffffff; font-size: 12px; outline: none;">
        <button type="button" class="btn-secondary" onclick="submitProductManualActivityNote()" style="padding: 8px 14px; background: rgba(56,189,248,0.15); border-color: rgba(56,189,248,0.4); color: #38bdf8; font-weight: 800; font-size: 12px; border-radius: 6px; cursor: pointer; white-space: nowrap;">
          + Not Ekle
        </button>
      </div>
      <button type="button" class="btn-secondary" onclick="closeProductActivityHistoryModal()" style="background: #334155; border: 1px solid #475569; color: #cbd5e1; font-weight: 700; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-size: 12px;">
        ✕ Kapat
      </button>
    </div>

  </div>
</div>
