<!-- =========================================================
     MODAL: ÖZEL BARKOD YÖNETİMİ (MAKSİMUM 6 ADET KISAYOL)
     ========================================================= -->
<div id="modal-custom-barcodes-manage" class="modal-backdrop" style="display: none; position: fixed; inset: 0; background: rgba(5, 10, 20, 0.85); backdrop-filter: blur(6px); z-index: 999999; align-items: center; justify-content: center; padding: 15px; box-sizing: border-box;">
  <div style="background: #0f172a; border: 1.5px solid rgba(168,85,247,0.4); border-radius: 14px; width: 560px; max-width: 96%; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,0.85); padding: 22px; box-sizing: border-box;">
    
    <!-- Başlık & Kapat Butonu -->
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 14px; margin-bottom: 16px;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="font-size: 24px; background: rgba(168,85,247,0.15); border: 1px solid rgba(168,85,247,0.3); border-radius: 8px; padding: 4px 8px;">🏷️</span>
        <div>
          <h3 style="margin: 0; font-size: 16px; font-weight: 800; color: #f8fafc; display: flex; align-items: center; gap: 8px;">
            Özel Barkod Yönetimi
          </h3>
          <small style="color: #94a3b8; font-size: 12px;">Hızlı satış ve aramada kullanılacak 6 adet özel kısayol barkodu</small>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <span id="custom-barcodes-count-badge" style="background: #1e293b; border: 1px solid rgba(168,85,247,0.4); border-radius: 6px; padding: 3px 10px; font-size: 12px; font-weight: 800; color: #d8b4fe;">0 / 6 Dolu</span>
        <button onclick="closeCustomBarcodesManageModal()" style="background: #1e293b; border: 1px solid #334155; border-radius: 6px; color: #94a3b8; font-size: 16px; cursor: pointer; padding: 4px 10px; line-height: 1;">✕</button>
      </div>
    </div>

    <!-- Mevcut Özel Barkodlar Listesi -->
    <div id="custom-barcodes-manage-list" style="display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; margin-bottom: 16px; padding-right: 4px;">
      <!-- JS ile dinamik doldurulur -->
    </div>

    <!-- Yeni Özel Barkod Ekleme Formu -->
    <div id="custom-barcodes-add-form" style="background: #070d1e; border: 1px dashed rgba(168,85,247,0.4); border-radius: 10px; padding: 12px; margin-bottom: 16px;">
      <div style="font-size: 12px; font-weight: 700; color: #d8b4fe; margin-bottom: 8px; display: flex; align-items: center; gap: 6px;">
        <span>➕</span> <span>Yeni Özel Kısayol Barkodu Ekle</span>
      </div>
      <div style="display: grid; grid-template-columns: 1.2fr 1fr auto; gap: 8px; align-items: center;">
        <input type="text" id="new-cb-name" placeholder="Ürün / Kısayol Adı (Örn: MANAV, EKMEK, POŞET)" style="padding: 8px 12px; background: #0f172a; border: 1.5px solid #334155; border-radius: 8px; color: #f8fafc; font-size: 12.5px; font-weight: 700; outline: none; box-sizing: border-box;">
        <input type="text" id="new-cb-code" value="" placeholder="Barkod Kodu (Örn: MANAV, BARKODSUZ-1, OZEL01)" style="padding: 8px 12px; background: #0f172a; border: 1.5px solid rgba(168,85,247,0.4); border-radius: 8px; color: #38bdf8; font-family: monospace; font-size: 12px; font-weight: 800; outline: none; box-sizing: border-box;">
        <button type="button" onclick="submitAddNewCustomBarcode()" style="padding: 8px 16px; font-size: 12.5px; font-weight: 800; background: linear-gradient(135deg, #a855f7, #7c3aed); color: #ffffff; border: none; border-radius: 8px; cursor: pointer; white-space: nowrap; box-shadow: 0 4px 12px rgba(168,85,247,0.3);">
          ➕ Ekle
        </button>
      </div>
    </div>

    <!-- Alt Kapat Butonu -->
    <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 14px;">
      <small style="color: #94a3b8; font-size: 11.5px;">💡 Bir özel barkodu sildiğinizde, o koda atanmış tüm ürünlerin özel barkodları otomatik temizlenir ve barkodsuz kalır.</small>
      <button type="button" onclick="closeCustomBarcodesManageModal()" style="padding: 7px 18px; font-size: 12.5px; font-weight: 700; background: #1e293b; border: 1px solid #475569; color: #e2e8f0; border-radius: 8px; cursor: pointer;">Kapat (Esc)</button>
    </div>

  </div>
</div>
