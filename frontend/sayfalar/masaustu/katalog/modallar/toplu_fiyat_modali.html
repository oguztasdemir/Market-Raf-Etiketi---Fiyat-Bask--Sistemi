<div id="modal-catalog-batch-price" class="modal-backdrop" style="display: none;">
    <div class="modal-card" style="max-width: 820px; width: 95%;">
      <div class="modal-header">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span style="font-size: 24px;">💰</span>
          <div>
            <h3 style="margin: 0; font-size: 15px; color: var(--text-main);">Seçilen Ürünlere Toplu Fiyat Belirleme</h3>
            <span id="batch-price-selected-badge" style="font-size: 11.5px; color: #38bdf8;">0 Ürün Seçildi</span>
          </div>
        </div>
        <button class="modal-close-btn" onclick="closeBatchPriceModal()">✕</button>
      </div>
      <div class="modal-body" style="padding: 12px 16px;">
        <div class="batch-price-grid">
          <!-- Sol Sütun: Seçilen Ürünler ve Mevcut Fiyatları -->
          <div class="batch-price-left-col">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
              <span style="font-size: 12px; font-weight: 700; color: var(--text-muted);">📋 Seçilen Ürünler</span>
              <span id="batch-price-count-info" style="font-size: 11px; color: #94a3b8;">0 Ürün</span>
            </div>
            <div id="batch-price-items-container" class="batch-price-scroll-list">
              <!-- JS dolduracak -->
            </div>
          </div>

          <!-- Sağ Sütun: Yeni Fiyat Girişi ve Karşılaştırmalı Önizleme -->
          <div class="batch-price-right-col">
            <div class="batch-price-control-box">
              <label style="font-size: 12.5px; font-weight: 800; color: #38bdf8;">⚡ Tümüne Uygulanacak Ortak Yeni Fiyat</label>
              <div style="display: flex; gap: 8px; margin-top: 6px;">
                <input type="text" id="batch-common-price-inp" placeholder="Örn: 45,00 TL" class="batch-price-big-input" oninput="onBatchPriceCommonInput(this.value)">
                <button type="button" class="btn-primary" onclick="applyCommonPriceToPreview()" style="padding: 0 16px; font-size: 12.5px;">Uygula</button>
              </div>
              <div style="font-size: 11px; color: var(--text-muted); margin-top: 6px;">
                💡 Bu kutuya yazacağınız fiyat, sol listedeki tüm ürünlere tek seferde atanacaktır.
              </div>
            </div>

            <div class="batch-price-summary-box">
              <div style="font-size: 11.5px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px;">ÖZET BİLGİ</div>
              <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px;">
                <span>Toplam Güncellenecek:</span>
                <strong id="batch-summary-count" style="color: var(--text-main);">0 Ürün</strong>
              </div>
              <div style="display: flex; justify-content: space-between; font-size: 12px;">
                <span>Yeni Satış Fiyatı:</span>
                <strong id="batch-summary-price" style="color: #38bdf8;">-</strong>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer" style="justify-content: space-between;">
        <button type="button" class="btn-secondary" onclick="closeBatchPriceModal()">✕ Vazgeç</button>
        <button type="button" class="btn-primary" onclick="submitBatchPriceUpdate()" style="background: linear-gradient(135deg, #059669, #10b981);">
          💾 Toplu Fiyatları Uygula ve Kaydet
        </button>
      </div>
    </div>
  </div>

  <!-- TOPLU MARKA / FİRMA DEĞİŞTİRME MODALI -->
