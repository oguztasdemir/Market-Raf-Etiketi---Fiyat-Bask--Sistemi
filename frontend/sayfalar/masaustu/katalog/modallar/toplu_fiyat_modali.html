<!-- =========================================================
     SEÇİLEN ÜRÜNLERE TOPLU FİYAT BELİRLEME MODALI
     ========================================================= -->
<div id="modal-catalog-batch-price" class="modal-backdrop" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(4, 8, 16, 0.88); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 9999999;">
  <div class="modal-card" style="max-width: 860px; width: 95%; background: #0b1324; border: 1.5px solid rgba(56, 189, 248, 0.5); border-radius: 16px; box-shadow: 0 25px 70px rgba(0,0,0,0.95); overflow: hidden; display: flex; flex-direction: column;">
    
    <!-- Modal Başlık -->
    <div class="modal-header" style="background: linear-gradient(135deg, #0369a1, #0f766e); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="font-size: 22px;">💰</span>
        <div>
          <h3 style="margin: 0; font-size: 16px; font-weight: 800; color: #ffffff;">Seçilen Ürünlere Toplu Fiyat Belirleme</h3>
          <span id="batch-price-selected-badge" style="font-size: 11.5px; color: #bae6fd; font-weight: 700;">0 Ürün Seçildi</span>
        </div>
      </div>
      <button class="modal-close-btn" onclick="closeBatchPriceModal()" style="background: rgba(255,255,255,0.15); border: none; color: #fff; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center;" title="Kapat">✕</button>
    </div>

    <!-- Modal Gövde: 2 Sütunlu Tasarım -->
    <div class="modal-body" style="padding: 16px 20px; display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px;">
      
      <!-- SOL SÜTUN: Seçilen Ürünler, Güncel Fiyatları ve Listeden Kaldır Butonu -->
      <div style="background: #070d1e; border: 1px solid #1e293b; border-radius: 12px; padding: 12px; display: flex; flex-direction: column;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.08);">
          <span style="font-size: 12.5px; font-weight: 800; color: #cbd5e1;">📋 Seçilen Ürünler & Güncel Fiyatlar</span>
          <span id="batch-price-count-info" style="font-size: 11.5px; color: #38bdf8; font-weight: 700;">0 Ürün</span>
        </div>
        
        <!-- Ürünler Listesi (Kaydırılabilir) -->
        <div id="batch-price-items-container" tabindex="0" style="max-height: 360px; min-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; outline: none;">
          <!-- JS Dinamik olarak dolduracak -->
        </div>
      </div>

      <!-- SAĞ SÜTUN: Yapılması Gereken Yeni Fiyat Girişi & Önizleme -->
      <div style="display: flex; flex-direction: column; gap: 14px;">
        
        <div style="background: #070d1e; border: 1.5px solid rgba(56, 189, 248, 0.4); border-radius: 12px; padding: 16px;">
          <label style="display: block; font-size: 13px; font-weight: 800; color: #38bdf8; margin-bottom: 6px;">⚡ Yapılması Gereken Yeni Fiyat:</label>
          <div style="display: flex; gap: 8px;">
            <input type="text" id="batch-common-price-inp" placeholder="Örn: 100,00 TL" style="width: 100%; background: #0b1324; border: 1.5px solid #38bdf8; color: #4ade80; padding: 12px 14px; border-radius: 8px; font-size: 18px; font-weight: 900; outline: none; box-sizing: border-box; text-align: center;" oninput="onBatchPriceCommonInput(this.value)" onkeydown="if(event.key==='Enter') submitBatchPriceUpdate()">
          </div>
          <p style="font-size: 11.5px; color: #94a3b8; margin: 8px 0 0 0; line-height: 1.4;">
            💡 Bu kutuya yazacağınız tutar, soldaki listede kalan <b>tüm ürünlerin yeni satış fiyatı</b> olacaktır.
          </p>
        </div>

        <div style="background: #070d1e; border: 1px solid #1e293b; border-radius: 12px; padding: 14px;">
          <div style="font-size: 11.5px; font-weight: 800; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">ÖZET BİLGİ</div>
          <div style="display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; color: #cbd5e1;">
            <span>Güncellenecek Ürün Sayısı:</span>
            <strong id="batch-summary-count" style="color: #38bdf8; font-weight: 800;">0 Ürün</strong>
          </div>
          <div style="display: flex; justify-content: space-between; font-size: 13px; color: #cbd5e1;">
            <span>Uygulanacak Yeni Fiyat:</span>
            <strong id="batch-summary-price" style="color: #4ade80; font-size: 15px; font-weight: 900;">-</strong>
          </div>
        </div>

      </div>

    </div>

    <!-- Modal Alt Butonları -->
    <div class="modal-footer" style="padding: 12px 20px; background: #070d1e; border-top: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-between; align-items: center;">
      <button type="button" class="btn-secondary" onclick="closeBatchPriceModal()" style="font-size: 13px; font-weight: 700; padding: 9px 20px; border-radius: 8px; background: #1e293b; color: #cbd5e1; border: 1px solid #475569; cursor: pointer;">✕ Vazgeç</button>
      <button id="btn-submit-batch-price" type="button" class="btn-primary" onclick="submitBatchPriceUpdate()" style="font-size: 13.5px; font-weight: 800; padding: 10px 26px; border-radius: 8px; background: linear-gradient(135deg, #059669, #10b981); border: none; color: #ffffff; cursor: pointer; box-shadow: 0 4px 14px rgba(16,185,129,0.4);">
        💾 Fiyatları Uygula ve Kaydet
      </button>
    </div>

  </div>
</div>
