<!-- =========================================================
     MÜŞTERİ VERESİYE, CARİ VE BORÇ/ALACAK DEFTERİ SEKMESİ
     ========================================================= -->
<div id="tab-customers" class="tab-content">
  <div class="card" style="padding: 16px; background: #0f172a; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; height: calc(100vh - 100px); display: flex; flex-direction: column; gap: 14px;">
    
    <!-- Üst Araç Çubuğu -->
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 12px; flex-wrap: wrap;">
      
      <!-- Sol: Başlık & Arama -->
      <div style="display: flex; align-items: center; gap: 12px; flex: 1; min-width: 320px;">
        <button type="button" onclick="switchTab('tab-home')" style="background: rgba(56,189,248,0.15); border: 1.5px solid #0284c7; border-radius: 6px; color: #38bdf8; padding: 6px 12px; font-weight: 800; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;">
          <span>🏠</span>
          <span>Ana Sayfa</span>
        </button>
        <div style="display: flex; align-items: center; gap: 6px;">
          <span style="font-size: 18px;">📒</span>
          <strong style="font-size: 15px; color: #f8fafc;">Müşteri Cari & Veresiye Defteri</strong>
        </div>
        <div style="flex: 1; position: relative;">
          <input type="text" id="customer-search-input" placeholder="Müşteri adı veya telefon ara..." oninput="onCustomerSearchInput(this.value)" style="width: 100%; background: #1e293b; border: 1px solid #475569; color: #fff; padding: 7px 12px 7px 32px; border-radius: 8px; font-size: 12.5px;">
          <span style="position: absolute; left: 10px; top: 7px; font-size: 12px; opacity: 0.6;">🔍</span>
        </div>
      </div>

      <!-- Sağ: İstatistikler & Yeni Müşteri Butonu -->
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="background: rgba(239,68,68,0.15); border: 1px solid #ef4444; padding: 5px 12px; border-radius: 8px; display: flex; align-items: center; gap: 6px;">
          <span style="font-size: 11px; color: #fca5a5; font-weight: 700;">Toplam Alacak:</span>
          <strong id="total-credit-balance-badge" style="font-size: 13px; color: #ef4444; font-weight: 900;">0,00 TL</strong>
        </div>

        <button type="button" onclick="openNewCustomerModal()" style="background: linear-gradient(135deg, #10b981, #059669); border: none; color: #fff; padding: 7px 16px; border-radius: 8px; font-weight: 900; font-size: 12.5px; cursor: pointer; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 12px rgba(16,185,129,0.3);">
          <span>➕ Yeni Müşteri Ekle</span>
        </button>
      </div>
    </div>

    <!-- Müşteri Listesi Tablosu -->
    <div style="flex: 1; overflow-y: auto; border: 1px solid rgba(255,255,255,0.06); border-radius: 8px;">
      <table style="width: 100%; border-collapse: collapse; font-size: 12.5px; text-align: left;">
        <thead style="background: #1e293b; position: sticky; top: 0; z-index: 10;">
          <tr style="color: #94a3b8; border-bottom: 1px solid rgba(255,255,255,0.1);">
            <th style="padding: 10px 14px;">MÜŞTERİ ADI SOYADI</th>
            <th style="padding: 10px 14px;">TELEFON</th>
            <th style="padding: 10px 14px;">GÜNCEL BAKİYE (BORÇ)</th>
            <th style="padding: 10px 14px;">KREDİ LİMİTİ</th>
            <th style="padding: 10px 14px;">SON İŞLEM TARİHİ</th>
            <th style="padding: 10px 14px; text-align: center;">İŞLEMLER</th>
          </tr>
        </thead>
        <tbody id="customer-table-body">
          <!-- JS tarafından dinamik doldurulacak -->
        </tbody>
      </table>
    </div>

  </div>
</div>

<!-- =========================================================
     MÜŞTERİ EKLE / DÜZENLE MODALI
     ========================================================= -->
<div id="modal-customer-edit" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 999999; align-items: center; justify-content: center; padding: 20px;">
  <div class="modal-card" style="background: #0f172a; border: 1.5px solid #10b981; border-radius: 16px; width: 100%; max-width: 480px; box-shadow: 0 25px 60px rgba(0,0,0,0.9); overflow: hidden; color: #f8fafc;">
    <div style="background: linear-gradient(135deg, #059669, #0d9488); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between;">
      <h3 id="modal-customer-title" style="margin: 0; font-size: 15px; font-weight: 900; color: #fff;">Yeni Müşteri Tanımla</h3>
      <button type="button" onclick="closeCustomerModal()" style="background: rgba(255,255,255,0.2); border: none; color: #fff; width: 26px; height: 26px; border-radius: 50%; cursor: pointer;">✕</button>
    </div>
    <div style="padding: 20px; display: flex; flex-direction: column; gap: 12px;">
      <input type="hidden" id="cust-edit-id" value="">
      <div>
        <label style="display: block; font-size: 11.5px; font-weight: 800; color: #94a3b8; margin-bottom: 4px;">Müşteri Adı Soyadı (*):</label>
        <input type="text" id="cust-edit-name" placeholder="Örn: AHMET YILMAZ" style="width: 100%; background: #1e293b; border: 1px solid #475569; color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 700;">
      </div>
      <div>
        <label style="display: block; font-size: 11.5px; font-weight: 800; color: #94a3b8; margin-bottom: 4px;">Telefon Numarası:</label>
        <input type="text" id="cust-edit-phone" placeholder="Örn: 05XX XXX XX XX" style="width: 100%; background: #1e293b; border: 1px solid #475569; color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 13px;">
      </div>
      <div>
        <label style="display: block; font-size: 11.5px; font-weight: 800; color: #94a3b8; margin-bottom: 4px;">Maksimum Veresiye Limiti (TL):</label>
        <input type="number" id="cust-edit-limit" placeholder="Örn: 5000" style="width: 100%; background: #1e293b; border: 1px solid #475569; color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 13px;">
      </div>
      <div>
        <label style="display: block; font-size: 11.5px; font-weight: 800; color: #94a3b8; margin-bottom: 4px;">Özel Not / Adres:</label>
        <textarea id="cust-edit-notes" placeholder="Müşteri hakkında özel notlar..." rows="2" style="width: 100%; background: #1e293b; border: 1px solid #475569; color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 12px;"></textarea>
      </div>
    </div>
    <div style="background: #090e1a; padding: 12px 20px; display: flex; align-items: center; justify-content: flex-end; gap: 8px;">
      <button type="button" onclick="closeCustomerModal()" style="background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #94a3b8; padding: 7px 14px; border-radius: 6px; font-weight: 800; font-size: 12px; cursor: pointer;">İptal</button>
      <button type="button" onclick="saveCustomerForm()" style="background: #10b981; border: none; color: #fff; padding: 7px 18px; border-radius: 6px; font-weight: 900; font-size: 12.5px; cursor: pointer;">Kaydet</button>
    </div>
  </div>
</div>

<!-- =========================================================
     MÜŞTERİ HESAP EKSTRESİ & TAHSİLAT MODALI
     ========================================================= -->
<div id="modal-customer-statement" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 999999; align-items: center; justify-content: center; padding: 20px;">
  <div class="modal-card" style="background: #0f172a; border: 1.5px solid #38bdf8; border-radius: 16px; width: 100%; max-width: 680px; box-shadow: 0 25px 60px rgba(0,0,0,0.9); overflow: hidden; color: #f8fafc;">
    <div style="background: linear-gradient(135deg, #0284c7, #0369a1); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between;">
      <div>
        <h3 id="statement-cust-name" style="margin: 0; font-size: 16px; font-weight: 900; color: #fff;">Müşteri Hesap Ekstresi</h3>
        <span id="statement-cust-phone" style="font-size: 11.5px; color: #bae6fd;">-</span>
      </div>
      <button type="button" onclick="closeCustomerStatementModal()" style="background: rgba(255,255,255,0.2); border: none; color: #fff; width: 26px; height: 26px; border-radius: 50%; cursor: pointer;">✕</button>
    </div>
    
    <!-- Bakiye & Hızlı Tahsilat Paneli -->
    <div style="padding: 16px 20px; background: #1e293b; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; gap: 16px;">
      <div>
        <span style="font-size: 11.5px; color: #94a3b8; font-weight: 700;">Güncel Borç Bakiyesi:</span>
        <div id="statement-current-balance" style="font-size: 22px; font-weight: 900; color: #ef4444;">0,00 TL</div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <input type="number" id="quick-payment-amount" placeholder="Tahsilat Tutarı" step="1" style="width: 130px; background: #0f172a; border: 1px solid #10b981; color: #fff; padding: 7px 10px; border-radius: 6px; font-size: 13px; font-weight: 800;">
        <button type="button" onclick="executeCustomerPayment()" style="background: #10b981; border: none; color: #fff; padding: 7px 14px; border-radius: 6px; font-weight: 900; font-size: 12px; cursor: pointer;">💵 Tahsilat Al</button>
        <button type="button" onclick="executeCustomerNewDebt()" style="background: #ef4444; border: none; color: #fff; padding: 7px 14px; border-radius: 6px; font-weight: 900; font-size: 12px; cursor: pointer;">➕ Borç Yaz</button>
      </div>
    </div>

    <!-- Hesap Hareketleri Listesi -->
    <div style="padding: 14px 20px; max-height: 280px; overflow-y: auto;">
      <h4 style="margin: 0 0 8px 0; font-size: 12px; font-weight: 800; color: #94a3b8;">HESAP HAREKETLERİ GEÇMİŞİ</h4>
      <div id="statement-transactions-list" style="display: flex; flex-direction: column; gap: 6px;">
        <!-- JS tarafından doldurulacak -->
      </div>
    </div>

    <div style="background: #090e1a; padding: 10px 20px; display: flex; align-items: center; justify-content: flex-end;">
      <button type="button" onclick="closeCustomerStatementModal()" style="background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #94a3b8; padding: 6px 16px; border-radius: 6px; font-weight: 800; font-size: 12px; cursor: pointer;">Kapat</button>
    </div>
  </div>
</div>
