<div id="modal-print-progress" class="modal-backdrop" style="display: none; z-index: 9999;">
    <div class="modal-card" style="max-width: 500px; width: 95%; text-align: center;">
      <div class="modal-header" style="justify-content: center; border-bottom: none; padding-bottom: 0;">
        <h3 id="print-ctrl-modal-title" style="font-size: 16px; color: #38bdf8;">🖨️ Etiketler Yazdırılıyor...</h3>
      </div>
      
      <div class="modal-body" style="display: flex; flex-direction: column; gap: 12px; padding-top: 8px;">
        
        <!-- İlerleme Çubuğu -->
        <div style="background: #090d16; border: 1px solid var(--border-color); border-radius: 8px; padding: 3px; overflow: hidden;">
          <div id="print-ctrl-progress-bar" style="background: linear-gradient(90deg, #0284c7, #38bdf8); height: 14px; border-radius: 5px; width: 0%; transition: width 0.2s ease;"></div>
        </div>

        <!-- İlerleme Sayaç & Durum Metni -->
        <div style="display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 700;">
          <span id="print-ctrl-count-text" style="color: var(--text-main);">0 / 0 Etiket</span>
          <span id="print-ctrl-percent-text" style="color: #38bdf8;">%0</span>
        </div>

        <!-- O An Basılan Ürün Kartı -->
        <div style="background: #090d16; border: 1px solid var(--border-color); border-radius: 8px; padding: 8px 12px; text-align: left;">
          <div style="font-size: 10.5px; color: var(--text-muted);">Yazdırılan Ürün:</div>
          <strong id="print-ctrl-current-item" style="font-size: 13px; color: var(--text-main);">-</strong>
        </div>

        <!-- Duraklatıldı İkaz Kutusu -->
        <div id="print-ctrl-pause-alert" style="display: none; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.4); border-radius: 8px; padding: 8px; color: #fbbf24; font-size: 12px; font-weight: 700;">
          ⏸️ Yazdırma Duraklatıldı. Lütfen devam etmek veya iptal etmek için bir işlem seçin.
        </div>

      </div>

      <!-- Aksiyon Butonları -->
      <div class="modal-footer" style="justify-content: center; gap: 10px; padding-top: 4px;">
        <button id="btn-print-ctrl-pause" class="btn-primary" onclick="pausePrinting()" style="background: linear-gradient(135deg, #ef4444, #b91c1c); border: none; font-size: 13px; padding: 7px 16px;">
          ⏸️ Yazdırmayı Durdur
        </button>

        <button id="btn-print-ctrl-resume" class="btn-primary" onclick="resumePrintingWithConfirm()" style="display: none; background: linear-gradient(135deg, #10b981, #059669); border: none; font-size: 13px; padding: 7px 16px;">
          ▶️ Devam Et
        </button>
        <button id="btn-print-ctrl-cancel" class="btn-secondary" onclick="cancelPrintingWithConfirm()" style="display: none; color: #ef4444; border-color: rgba(239,68,68,0.4); font-size: 13px; padding: 7px 16px;">
          ⛔ İptal Et
        </button>
      </div>

    </div>
  </div>

  <!-- BASKI SONRASI DOĞRULAMA & FİYAT GÜNCELLEME ONAY MODALI (PC) -->
