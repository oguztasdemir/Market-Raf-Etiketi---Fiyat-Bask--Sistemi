<header class="app-topbar no-print" style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #0f172a; border-bottom: 1px solid #1e293b;">
  <div class="topbar-title">
    <h1 id="page-heading" style="margin: 0; font-size: 17px; font-weight: 800; color: #f8fafc;">🏠 Ana Sayfa</h1>
    <p id="page-subheading" style="margin: 2px 0 0 0; font-size: 11.5px; color: #94a3b8;">Market Raf Fiyat Etiketi ve Satış Yönetim Sistemi</p>
  </div>

  <!-- Üst Sağ: Personel Durumu, Mola, Kasiyer Değiştir & Güvenli Çıkış -->
  <div class="topbar-actions" style="display: flex; align-items: center; gap: 8px;">
    <!-- Durum Rozeti -->
    <span id="header-employee-status-badge" style="font-size: 11.5px; font-weight: 800; padding: 5px 10px; border-radius: 6px; background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.4); color: #34d399;">
      🟢 Görevde
    </span>

    <!-- Anlık Mola / Göreve Dön Butonu -->
    <button id="btn-header-break-toggle" type="button" onclick="toggleEmployeeBreak()" style="background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.4); color: #fbbf24; font-weight: 700; font-size: 12px; padding: 6px 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 5px;" title="Anlık Mola / İzne Ayrıl veya Göreve Dön">
      <span id="header-break-icon">☕</span>
      <span id="header-break-text">Molaya Çık</span>
    </button>

    <!-- Kasiyer / Personel Değiştir Butonu -->
    <button type="button" onclick="openCashierSwitchModal()" style="display: flex; align-items: center; gap: 7px; background: rgba(30,41,59,0.9); border: 1px solid rgba(56,189,248,0.3); padding: 6px 14px; border-radius: 8px; cursor: pointer;" title="Kasiyer / Çalışan Değiştir">
      <span style="font-size: 14px;">👤</span>
      <span id="header-active-cashier-name" style="font-weight: 700; color: #38bdf8; font-size: 12.5px;">Yönetici (Admin)</span>
      <span style="font-size: 10px; color: #94a3b8;">▼</span>
    </button>

    <!-- Güvenli Çıkış (Logout) Butonu -->
    <button type="button" onclick="safeEmployeeLogout()" style="background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4); color: #f87171; font-weight: 800; font-size: 12px; padding: 6px 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 5px;" title="Güvenli Çıkış (Oturumu Kapat)">
      <span>🚪</span>
      <span>Çıkış</span>
    </button>
  </div>
</header>
