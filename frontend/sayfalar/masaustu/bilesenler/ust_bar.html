<header class="app-topbar no-print" style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #0f172a; border-bottom: 1px solid #1e293b;">
  <div class="topbar-title">
    <h1 id="page-heading" style="margin: 0; font-size: 17px; font-weight: 800; color: #f8fafc;">🏠 Ana Sayfa</h1>
    <p id="page-subheading" style="margin: 2px 0 0 0; font-size: 11.5px; color: #94a3b8;">Market Raf Fiyat Etiketi ve Satış Yönetim Sistemi</p>
  </div>

  <!-- Üst Orta: Web Versiyonu Bağlantısı -->
  <div class="topbar-middle">
    {% if local_ip %}
    <div style="background: rgba(56,189,248,0.1); border: 1px solid rgba(56,189,248,0.3); border-radius: 8px; padding: 6px 15px; font-size: 12px; display: flex; align-items: center; gap: 8px; box-shadow: 0 0 15px rgba(56,189,248,0.1);" title="Yerel ağdaki diğer cihazlardan bu sisteme bağlanmak için tarayıcıya bu adresi yazın">
      <span style="color: #38bdf8; font-weight: 800; display: flex; align-items: center; gap: 4px;">🌐 Mobil & Dış Cihaz Bağlantı Adresi:</span>
      <a href="http://{{ local_ip }}:5000" target="_blank" style="color: #f8fafc; font-weight: 800; text-decoration: underline; font-family: monospace; letter-spacing: 0.5px;">http://{{ local_ip }}:5000</a>
    </div>
    {% endif %}
  </div>

  <!-- Üst Sağ -->
  <div class="topbar-actions" style="display: flex; align-items: center; gap: 8px;">
    <button type="button" onclick="startSecureWifiDownload()" style="display: flex; align-items: center; gap: 5px; background: rgba(52,211,153,0.15); border: 1px solid rgba(52,211,153,0.4); color: #34d399; font-size: 11.5px; font-weight: 800; padding: 6px 12px; border-radius: 8px; cursor: pointer; transition: all 0.15s ease;" title="Kurulum Dosyasını ve Güncel Fiyat Listesini (ZIP) Şifre ile İndir">
      <span>📥</span>
      <span>Wi-Fi'dan Setup İndir</span>
    </button>
    <button id="btn-topbar-theme" class="btn-theme-circle" onclick="toggleAppTheme()" title="Koyu / Açık Mod Değiştir" style="width: 34px; height: 34px; font-size: 14px; border-radius: 8px; background: #1e293b; border: 1px solid #334155; color: #f8fafc; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s ease;">
      <span>🌙</span>
    </button>
  </div>
</header>

<script>
async function startSecureWifiDownload() {
  const localIp = "{{ local_ip or '127.0.0.1' }}";
  const downloadUrl = `http://${localIp}:5000/indir`;
  
  const promptHtml = `
    <div style="font-size: 13.5px; line-height: 1.5; color: #cbd5e1; margin-bottom: 8px;">
      Kurulum dosyası ve güncel fiyat listesini (ZIP) indirmek için lütfen <b>Yönetici Şifresini</b> girin:
    </div>
    <div style="background: rgba(56, 189, 248, 0.08); border: 1px dashed rgba(56, 189, 248, 0.4); border-radius: 8px; padding: 10px 12px; margin: 8px 0 10px 0; font-size: 12px;">
      <div style="color: #38bdf8; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 5px;">
        <span>🌐</span> <span>Diğer PC / Tarayıcı İndirme Linki:</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; background: rgba(0,0,0,0.35); padding: 5px 8px; border-radius: 6px;">
        <a href="${downloadUrl}" target="_blank" style="color: #f8fafc; font-family: monospace; font-size: 12.5px; font-weight: 700; text-decoration: underline; word-break: break-all;">${downloadUrl}</a>
        <button type="button" onclick="navigator.clipboard.writeText('${downloadUrl}'); showToast('İndirme linki kopyalandı!', 'success');" style="background: #1e293b; border: 1px solid #475569; color: #38bdf8; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px; cursor: pointer; white-space: nowrap;">📋 Kopyala</button>
      </div>
    </div>
  `;

  if (typeof showCustomPrompt === 'function') {
    const pin = await showCustomPrompt(
      promptHtml,
      "",
      "🔐 Güvenli İndirme Doğrulaması",
      "Doğrula ve İndir",
      "Vazgeç"
    );
    if (pin) {
      window.location.href = `/indir?pin=${encodeURIComponent(pin.trim())}`;
    }
  } else {
    window.location.href = '/indir';
  }
}
</script>
