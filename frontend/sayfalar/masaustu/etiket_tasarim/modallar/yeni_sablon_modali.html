<div id="modal-new-template" class="modal-backdrop" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3>✨ Yeni Etiket Modeli Oluştur</h3>
        <button class="modal-close-btn" onclick="closeNewModelModal()">✕</button>
      </div>
      <div class="modal-body">
        <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;">
          Oluşturmak istediğiniz etiket modeli için bir isim belirleyin.
        </p>
        <div class="form-group">
          <label>Model Adı</label>
          <input type="text" id="modal-inp-tpl-name" placeholder="Örn: Kampanyalı Model, Şarküteri Rafı, QR Etiketi..." onkeydown="if(event.key==='Enter') submitNewModelModal()">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeNewModelModal()">İptal</button>
        <button class="btn-primary" onclick="submitNewModelModal()">✓ Modeli Oluştur</button>
      </div>
    </div>
  </div>

  <!-- UYGULAMA İÇİ MODEL ADI DEĞİŞTİRME MODALI -->
