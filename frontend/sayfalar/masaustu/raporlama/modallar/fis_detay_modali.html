<div id="modal-report-receipt-detail" class="modal-backdrop" style="display: none; position: fixed; inset: 0; background: rgba(5, 10, 20, 0.88); backdrop-filter: blur(8px); z-index: 999999999; justify-content: center; align-items: center; padding: 16px; box-sizing: border-box;">
  <div style="background: #0f172a; border: 1px solid rgba(56,189,248,0.4); border-radius: 12px; width: 540px; max-width: 95vw; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.85);">
    
    <!-- Modal Üst Başlık -->
    <div style="padding: 12px 18px; background: #0b1329; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-between; align-items: center;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 20px;">🧾</span>
        <div>
          <h3 id="rep-receipt-modal-title" style="margin: 0; font-size: 14.5px; font-weight: 800; color: #38bdf8;">Kasa Satış Fişi Detayı</h3>
          <small id="rep-receipt-modal-sub" style="color: #94a3b8; font-size: 11px;">Fiş bilgileri ve satılan ürün kalemleri</small>
        </div>
      </div>
      <button onclick="closeReportReceiptDetailModal()" class="btn-secondary" style="padding: 3px 8px; font-weight: 800; font-size: 13px;">✕</button>
    </div>

    <!-- Fiş Termal / Dijital Görünüm Kartı -->
    <div style="padding: 14px 18px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 12px;">
      
      <!-- Fiş Üst Meta Bilgileri -->
      <div style="background: rgba(15,23,42,0.8); border: 1px dashed rgba(56,189,248,0.3); border-radius: 8px; padding: 12px 14px; font-family: monospace; font-size: 11.5px; color: #cbd5e1; display: flex; flex-direction: column; gap: 4px;">
        <div style="display: flex; justify-content: space-between;">
          <span style="color: #94a3b8;">FİŞ NO:</span>
          <strong id="rep-rcpt-no" style="color: #f8fafc; font-size: 12px;">-</strong>
        </div>
        <div style="display: flex; justify-content: space-between;">
          <span style="color: #94a3b8;">TARİH / SAAT:</span>
          <span id="rep-rcpt-datetime" style="color: #f8fafc;">-</span>
        </div>
        <div style="display: flex; justify-content: space-between;">
          <span style="color: #94a3b8;">KASİYER:</span>
          <span id="rep-rcpt-cashier" style="color: #f8fafc;">-</span>
        </div>
        <div style="display: flex; justify-content: space-between;">
          <span style="color: #94a3b8;">ÖDEME TÜRÜ:</span>
          <span id="rep-rcpt-payment" style="font-weight: 700; color: #38bdf8;">-</span>
        </div>
      </div>

      <!-- Kalem Kalem Satılan Ürünler Tablosu -->
      <div style="background: #090d16; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; overflow: hidden;">
        <table style="width: 100%; border-collapse: collapse; font-size: 11.5px;">
          <thead>
            <tr style="background: rgba(15,23,42,0.9); border-bottom: 1px solid rgba(255,255,255,0.1); color: #94a3b8; font-size: 10.5px; text-transform: uppercase;">
              <th style="padding: 7px 10px; text-align: left;">Ürün Adı</th>
              <th style="padding: 7px 8px; text-align: center;">Miktar</th>
              <th style="padding: 7px 8px; text-align: right;">Birim Fiyat</th>
              <th style="padding: 7px 10px; text-align: right;">Tutar</th>
            </tr>
          </thead>
          <tbody id="rep-rcpt-items-tbody">
            <!-- JS Tarafından doldurulacak -->
          </tbody>
        </table>
      </div>

      <!-- Tutar, KDV ve Ödeme Özeti -->
      <div style="background: #0b1329; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-family: monospace; font-size: 12px;">
        <div style="display: flex; justify-content: space-between; color: #94a3b8;">
          <span>Toplam Kalem / Miktar:</span>
          <span id="rep-rcpt-total-qty" style="color: #cbd5e1;">-</span>
        </div>
        <div style="display: flex; justify-content: space-between; color: #94a3b8;">
          <span>Hesaplanan KDV:</span>
          <span id="rep-rcpt-vat" style="color: #cbd5e1;">-</span>
        </div>
        <div id="rep-rcpt-cash-change-box" style="display: none; flex-direction: column; gap: 4px; border-top: 1px dashed rgba(255,255,255,0.08); padding-top: 4px;">
          <div style="display: flex; justify-content: space-between; color: #94a3b8;">
            <span>Alınan Nakit:</span>
            <span id="rep-rcpt-received-cash" style="color: #cbd5e1;">-</span>
          </div>
          <div style="display: flex; justify-content: space-between; color: #94a3b8;">
            <span>Para Üstü:</span>
            <span id="rep-rcpt-change-amt" style="color: #38bdf8; font-weight: 700;">-</span>
          </div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.12); padding-top: 6px; margin-top: 2px;">
          <strong style="color: #f8fafc; font-size: 14px;">GENEL TOPLAM:</strong>
          <strong id="rep-rcpt-grand-total" style="color: #10b981; font-size: 18px; font-weight: 900;">0,00 TL</strong>
        </div>
      </div>

    </div>

    <!-- Alt Eylemler -->
    <div style="padding: 10px 18px; background: #0b1329; border-top: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-between; align-items: center;">
      <button type="button" onclick="printCurrentReportReceipt()" class="btn-secondary" style="padding: 6px 14px; font-size: 12px; font-weight: 700; background: rgba(56,189,248,0.1); border-color: rgba(56,189,248,0.3); color: #38bdf8;">
        🖨️ Fişi Yazdır / Gönder
      </button>
      <button type="button" onclick="closeReportReceiptDetailModal()" class="btn-primary" style="padding: 6px 18px; font-weight: 800; font-size: 12px;">
        Kapat
      </button>
    </div>

  </div>
</div>
