<div id="modal-pos-exit-confirm" class="modal-backdrop" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 99999999; align-items: center; justify-content: center;">
  <div style="background: #0b1324; border: 1.5px solid rgba(239, 68, 68, 0.4); border-radius: 14px; width: 540px; max-width: 94%; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,0.9); padding: 24px; box-sizing: border-box;">
    
    <h3 style="color: #f8fafc; font-size: 17px; font-weight: 800; margin: 0 0 12px 0; display: flex; align-items: center; gap: 8px;">
      <span style="color: #ef4444; font-size: 20px;">⚠️</span> <span>Bekleyen Satışlar Var</span>
    </h3>
    
    <div id="pos-exit-confirm-summary" style="background: #070d1e; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 12px 14px; margin: 12px 0; font-size: 13.5px; color: #cbd5e1; display: flex; flex-direction: column; gap: 6px;">
      <!-- JS ile doldurulur -->
    </div>

    <p style="color: #cbd5e1; font-size: 14px; line-height: 1.6; margin: 0 0 20px 0;">
      Kasada henüz tamamlanmamış veya askıda bekleyen satışlar bulunmaktadır. Yine de kapatmak istiyor musunuz?
    </p>

    <div style="display: flex; gap: 10px; justify-content: flex-end;">
      <button type="button" onclick="cancelPosExitModal()" style="padding: 10px 20px; font-size: 13.5px; font-weight: 700; background: #1e293b; border: 1px solid #475569; color: #e2e8f0; border-radius: 8px; cursor: pointer;">
        İptal (Esc)
      </button>
      <button type="button" onclick="forceClosePosApp()" style="padding: 10px 22px; font-size: 13.5px; font-weight: 800; background: #dc2626; color: #ffffff; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 14px rgba(220,38,38,0.4);">
        Yine de Kapat
      </button>
    </div>

  </div>
</div>
