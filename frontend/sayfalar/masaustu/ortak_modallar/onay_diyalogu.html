<div id="modal-app-confirm" class="modal-backdrop" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(4, 8, 16, 0.88); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 99999999;">
    <div class="modal-card" style="max-width: 560px; width: 94%; border: 1.5px solid rgba(56, 189, 248, 0.5); box-shadow: 0 24px 70px rgba(0,0,0,0.95); background: #0b1324; border-radius: 16px; padding: 24px; box-sizing: border-box; animation: fadeIn 0.15s ease;">
      <div class="modal-header" style="border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 14px; display: flex; justify-content: space-between; align-items: center;">
        <h3 id="app-confirm-title" style="font-size: 17px; font-weight: 800; display: flex; align-items: center; gap: 10px; color: #f8fafc; margin: 0;">
          <span id="app-confirm-icon" style="font-size: 20px;">⚠️</span> <span id="app-confirm-title-text">Onay Gerekiyor</span>
        </h3>
        <button class="modal-close-btn" onclick="_resolveAppConfirm(false)" style="background: none; border: none; color: #94a3b8; font-size: 22px; cursor: pointer; padding: 0 4px; line-height: 1;" title="Kapat">&times;</button>
      </div>
      <div class="modal-body" style="padding: 20px 0 16px 0;">
        <p id="app-confirm-msg" style="font-size: 14.5px; font-weight: 500; color: #e2e8f0; line-height: 1.6; margin: 0; white-space: pre-line;"></p>
      </div>
      <div class="modal-footer" style="gap: 12px; display: flex; justify-content: flex-end; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.1);">
        <button id="app-confirm-btn-cancel" class="btn-secondary" onclick="_resolveAppConfirm(false)" style="font-size: 13.5px; font-weight: 700; padding: 9px 20px; border-radius: 8px; cursor: pointer; background: #1e293b; color: #cbd5e1; border: 1px solid #475569;">Vazgeç</button>
        <button id="app-confirm-btn-ok" class="btn-primary" onclick="_resolveAppConfirm(true)" style="font-size: 13.5px; font-weight: 800; padding: 9px 24px; border-radius: 8px; cursor: pointer; background: linear-gradient(135deg, #0284c7, #2563eb); border: none; color: #ffffff; box-shadow: 0 4px 14px rgba(37,99,235,0.4);">Onayla</button>
      </div>
    </div>
  </div>
