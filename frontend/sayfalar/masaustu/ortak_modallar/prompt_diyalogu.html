<div id="modal-app-prompt" class="modal-backdrop" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(4, 8, 16, 0.88); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 99999999;">
    <div class="modal-card" style="max-width: 560px; width: 94%; border: 1.5px solid rgba(56, 189, 248, 0.5); box-shadow: 0 24px 70px rgba(0,0,0,0.95); background: #0b1324; border-radius: 16px; padding: 24px; box-sizing: border-box; animation: fadeIn 0.15s ease;">
      <div class="modal-header" style="border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 14px; display: flex; justify-content: space-between; align-items: center;">
        <h3 id="app-prompt-title" style="font-size: 17px; font-weight: 800; display: flex; align-items: center; gap: 10px; color: #f8fafc; margin: 0;">
          <span style="font-size: 20px;">✏️</span> <span id="app-prompt-title-text">Bilgi Girişi</span>
        </h3>
        <button class="modal-close-btn" onclick="_resolveAppPrompt(null)" style="background: none; border: none; color: #94a3b8; font-size: 22px; cursor: pointer; padding: 0 4px; line-height: 1;" title="Kapat">&times;</button>
      </div>
      <div class="modal-body" style="padding: 20px 0 16px 0; display: flex; flex-direction: column; gap: 12px;">
        <label id="app-prompt-msg" style="font-size: 14.5px; font-weight: 500; color: #e2e8f0; line-height: 1.5; margin: 0;"></label>
        <input type="text" id="app-prompt-input" class="form-control" style="width: 100%; background: #070d1e; border: 1.5px solid #38bdf8; color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 15px; font-weight: 600; outline: none; box-sizing: border-box;" onkeydown="if(event.key==='Enter') _resolveAppPrompt(this.value)">
      </div>
      <div class="modal-footer" style="gap: 12px; display: flex; justify-content: flex-end; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.1);">
        <button class="btn-secondary" onclick="_resolveAppPrompt(null)" style="font-size: 13.5px; font-weight: 700; padding: 9px 20px; border-radius: 8px; cursor: pointer; background: #1e293b; color: #cbd5e1; border: 1px solid #475569;">İptal</button>
        <button class="btn-primary" onclick="_resolveAppPrompt(document.getElementById('app-prompt-input').value)" style="font-size: 13.5px; font-weight: 800; padding: 9px 24px; border-radius: 8px; cursor: pointer; background: linear-gradient(135deg, #0284c7, #2563eb); border: none; color: #ffffff; box-shadow: 0 4px 14px rgba(37,99,235,0.4);">Kaydet</button>
      </div>
    </div>
  </div>

  <!-- VERİ AKTARIMI & SENKRONİZASYON PROGRESS MODAL -->
  <div id="modal-sync-progress" class="modal-backdrop" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(4, 8, 16, 0.85); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 999999;">
    <div class="modal-card" style="max-width: 480px; width: 92%; border: 1px solid rgba(16, 185, 129, 0.5); box-shadow: 0 30px 80px rgba(0,0,0,0.95); padding: 26px; text-align: center; border-radius: 16px; background: #0c121e; margin: auto;">
      <div style="font-size: 38px; margin-bottom: 10px;" id="sync-progress-icon">⚡</div>
      <h3 id="sync-progress-title" style="font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 6px;">Kataloğa Veri Aktarılıyor</h3>
      <p id="sync-progress-sub" style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">Lütfen işlem tamamlanana kadar bekleyiniz...</p>

      <!-- İlerleme Çubuğu (Process Bar) -->
      <div style="background: rgba(255,255,255,0.08); border-radius: 12px; height: 22px; overflow: hidden; position: relative; margin-bottom: 14px; border: 1px solid rgba(255,255,255,0.15); padding: 2px;">
        <div id="sync-progress-fill" style="width: 0%; height: 100%; background: linear-gradient(90deg, #10b981, #38bdf8); border-radius: 10px; transition: width 0.12s ease-out;"></div>
      </div>

      <!-- Sayısal İlerleme Göstergesi -->
      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13.5px; font-weight: 800; color: #cbd5e1; padding: 0 4px; margin-bottom: 14px;">
        <span id="sync-progress-count" style="color: #38bdf8;">0 / 0 Ürün Aktarılıyor</span>
        <span id="sync-progress-percent" style="color: #10b981;">0%</span>
      </div>

      <!-- Aktif İşlenen Ürün Bilgisi -->
      <div id="sync-progress-current-item" style="font-size: 11.5px; color: #94a3b8; margin-bottom: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: monospace; background: rgba(0,0,0,0.4); padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.06);"></div>

      <!-- Modal Alt Butonları (Durdur / Tamam) -->
      <div style="display: flex; justify-content: center; gap: 10px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.08);">
        <button id="sync-progress-btn-cancel" class="btn-secondary" onclick="cancelSyncApply()" style="font-size: 12.5px; padding: 7px 22px; border-radius: 8px; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.35); color: #f87171; font-weight: 700; cursor: pointer;">
          🛑 Durdur / İptal Et
        </button>
        <button id="sync-progress-btn-done" class="btn-primary" onclick="closeSyncProgressModal()" style="display: none; font-size: 13px; padding: 8px 32px; border-radius: 8px; font-weight: 800; background: linear-gradient(135deg, #10b981, #059669); border: none; cursor: pointer; color: #fff; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);">
          ✓ Tamam
        </button>
      </div>
    </div>
  </div>



  <!-- GÜN DETAYI MODALI (TEKİL GÜNÜN KALEM KALEM LİSTESİ) -->
  <div id="modal-daily-detail-view" class="modal-backdrop" style="display: none; z-index: 9995;">

      <div class="modal-header">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span style="font-size: 24px;">🔍</span>
          <div>
            <h3 id="daily-detail-modal-title" style="margin: 0; font-size: 16px; color: var(--text-main);">Günün İşlem Detayları</h3>
            <span style="font-size: 12px; color: var(--text-muted);">Fiyatı değişen ürünler ve yazdırılan tüm etiketlerin dökümü</span>
          </div>
        </div>
        <button class="modal-close-btn" onclick="closeDailyDetailModal()">✕</button>
      </div>

      <!-- Alt Sekmeler ve Arama -->
      <div style="padding: 10px 16px; background: #090d16; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;">
        <div style="display: flex; gap: 8px;">
          <button id="btn-detail-tab-prices" class="btn-sm btn-primary" onclick="switchDetailSubTab('price_changes')" style="font-weight: 700;">
            💰 Fiyatı Değişen Ürünler
          </button>
          <button id="btn-detail-tab-prints" class="btn-sm btn-secondary" onclick="switchDetailSubTab('printed_items')" style="font-weight: 700;">

          </button>
        </div>
        <div style="flex: 1; max-width: 320px;">

        </div>
      </div>

      <div class="modal-body" style="flex: 1; overflow-y: auto; padding: 0;">

      </div>

      <div class="modal-footer" style="justify-content: flex-end;">

  </div>
