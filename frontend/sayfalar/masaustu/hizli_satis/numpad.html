<!-- 1. EN ÜSTTE DOKUNMATİK NUMPAD TUŞLARI (EN SOLDA EN SAĞA TAM GENİŞLİKTE) -->
        <div style="background: rgba(15,23,42,0.9); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 6px 10px; display: grid; grid-template-columns: repeat(14, 1fr); gap: 6px; align-items: center; width: 100%; box-sizing: border-box;">
          <button type="button" class="pos-numpad-key" onclick="appendPosKey('1')">1</button>
          <button type="button" class="pos-numpad-key" onclick="appendPosKey('2')">2</button>
          <button type="button" class="pos-numpad-key" onclick="appendPosKey('3')">3</button>
          <button type="button" class="pos-numpad-key" onclick="appendPosKey('4')">4</button>
          <button type="button" class="pos-numpad-key" onclick="appendPosKey('5')">5</button>
          <button type="button" class="pos-numpad-key" onclick="appendPosKey('6')">6</button>
          <button type="button" class="pos-numpad-key" onclick="appendPosKey('7')">7</button>
          <button type="button" class="pos-numpad-key" onclick="appendPosKey('8')">8</button>
          <button type="button" class="pos-numpad-key" onclick="appendPosKey('9')">9</button>
          <button type="button" class="pos-numpad-key" onclick="appendPosKey('0')">0</button>
          <button type="button" class="pos-numpad-key" onclick="appendPosKey('.')">.</button>
          <button type="button" class="pos-numpad-key special-star" onclick="appendPosKey('*')" title="Miktar Çarpı Barkod">*</button>
          <button type="button" class="pos-numpad-key special-del" onclick="backspacePosKey()" title="Geri Sil">⌫ SİL</button>
          <button type="button" class="pos-numpad-key special-enter" onclick="submitPosKey()" title="Onayla / Enter">⏎ OK</button>
        </div>
