<!-- SAĞ: 2 SÜTUNLU ADET MANAV & BARKODSUZ ÜRÜNLER + SAĞDA KATEGORİ SEÇİCİLER -->
<div class="pos-quick-container" style="background: #0b1329; border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 10px; display: grid; grid-template-columns: 1fr 100px; gap: 8px; height: 100%; box-sizing: border-box; overflow: hidden;">
  
  <!-- SOL BÖLÜM: 2 SÜTUNLU ÜRÜN KARTLARI + SAYFALAMA KONTROLLERİ -->
  <div style="display: flex; flex-direction: column; gap: 6px; height: 100%; overflow: hidden;">
    
    <!-- Başlık ve Sayfa Kontrolleri -->
    <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.08);">
      <div style="display: flex; align-items: center; gap: 6px;">
        <strong id="pos-quick-cat-heading" style="color: #38bdf8; font-size: 11.5px; font-weight: 900; letter-spacing: 0.5px;">MANAV ADET</strong>
        <span id="pos-quick-items-count" style="font-size: 10.5px; color: #64748b; font-weight: 700;">0 Ürün</span>
      </div>

      <!-- Sayfalama Kontrolleri (Örn: < Sayfa 1/2 >) -->
      <div id="pos-quick-pagination-controls" style="display: none; align-items: center; gap: 4px;">
        <button type="button" onclick="changePosQuickPage(-1)" id="btn-pos-quick-prev-page" style="background: #1e293b; border: 1px solid #334155; border-radius: 4px; color: #cbd5e1; font-size: 11px; padding: 2px 7px; cursor: pointer; font-weight: 800;">◀</button>
        <span id="pos-quick-page-indicator" style="font-size: 11px; font-weight: 800; color: #38bdf8; min-width: 50px; text-align: center;">1 / 1</span>
        <button type="button" onclick="changePosQuickPage(1)" id="btn-pos-quick-next-page" style="background: #1e293b; border: 1px solid #334155; border-radius: 4px; color: #cbd5e1; font-size: 11px; padding: 2px 7px; cursor: pointer; font-weight: 800;">▶</button>
      </div>
    </div>

    <!-- 2 Sütunlu Ürün Gridi -->
    <div id="pos-quick-3col-grid" style="display: grid; grid-template-columns: repeat(2, 1fr); grid-auto-rows: minmax(54px, max-content); gap: 8px; overflow-y: auto; flex: 1; padding-right: 2px; align-content: start;">
      <!-- JS dinamik dolduracak -->
    </div>

  </div>

  <!-- SAĞ BÖLÜM: DİKDÖRTGEN KATEGORİ TUŞLARI & DÜZENLEME BUTONU -->
  <div style="display: flex; flex-direction: column; gap: 6px; border-left: 1px solid rgba(255,255,255,0.08); padding-left: 8px; width: 100px;">
    <div style="font-size: 10px; font-weight: 800; color: #64748b; text-transform: uppercase; text-align: center; margin-bottom: 2px;">
      KATEGORİ
    </div>

    <!-- MANAV ADET BUTONU -->
    <button id="btn-cat-manav-adet" type="button" onclick="selectPosQuickCategory('manav_adet')" style="padding: 12px 4px; background: #0284c7; border: 2px solid #38bdf8; border-radius: 8px; color: #ffffff; font-size: 11px; font-weight: 800; cursor: pointer; text-align: center; width: 100%; transition: all 0.15s; box-shadow: 0 4px 12px rgba(2,132,199,0.35);">
      MANAV ADET
    </button>

    <!-- BARKODSUZ BUTONU -->
    <button id="btn-cat-barkodsuz" type="button" onclick="selectPosQuickCategory('barkodsuz')" style="padding: 12px 4px; background: #0f1c38; border: 1.5px solid rgba(255,255,255,0.12); border-radius: 8px; color: #cbd5e1; font-size: 11px; font-weight: 800; cursor: pointer; text-align: center; width: 100%; transition: all 0.15s;">
      BARKODSUZ
    </button>

    <!-- BARKODSUZ DÜZENLE / SIRALA BUTONU -->
    <div style="margin-top: auto; padding-top: 6px; border-top: 1px dashed rgba(255,255,255,0.1);">
      <button id="btn-customize-barkodsuz" type="button" onclick="openBarkodsuzManagerModal()" style="display: none; padding: 7px 4px; background: rgba(168,85,247,0.15); border: 1px solid rgba(168,85,247,0.4); border-radius: 8px; color: #d8b4fe; font-size: 10.5px; font-weight: 800; cursor: pointer; text-align: center; width: 100%; transition: all 0.15s;" title="Barkodsuz ürünlerin sırasını değiştirin, yeni ürün ekleyin veya çıkarın">
        ⚙️ Sırala / Düzenle
      </button>
    </div>
  </div>

</div>
