<!-- KASA ALT EYLEM BUTONLARI (10 TEMEL BUTON - TEK SATIR TAM EKRAN DİZİLİMİ) -->
<div class="pos-actions-bar" style="grid-template-columns: repeat(10, minmax(0, 1fr)) !important;">
  
  <!-- 1. HIZLI ÜRÜN (F10) -->
  <button id="btn-pos-action-quick-prod" type="button" class="pos-action-btn pos-btn-amber" onclick="openPosQuickProductModal()" title="Hızlı Ürün Tanımla ve Sepete Ekle [F10 / Insert]">
    <div class="pos-action-icon">⚡</div>
    <div class="pos-action-text">HIZLI ÜRÜN</div>
    <div class="pos-action-badge">[F10]</div>
  </button>

  <!-- 2. FİYAT GÖR (F2) -->
  <button id="btn-pos-action-price-check" type="button" class="pos-action-btn pos-btn-indigo" onclick="openPosPriceCheckModal()" title="Büyük Ekranda Ürün Fiyatı Gör [F2]">
    <div class="pos-action-icon">🔍</div>
    <div class="pos-action-text">FİYAT GÖR</div>
    <div class="pos-action-badge">[F2]</div>
  </button>

  <!-- 3. FİŞ İPTAL (F3) -->
  <button id="btn-pos-action-clear" type="button" class="pos-action-btn pos-btn-rose" onclick="confirmClearPosCart()" title="Fişi İptal Et / Satış Sepetini Sıfırla [F3]">
    <div class="pos-action-icon">🗑️</div>
    <div class="pos-action-text">FİŞ İPTAL</div>
    <div class="pos-action-badge">[F3]</div>
  </button>

  <!-- 4. ÖDEME AL (F4 - YEŞİL BUTON) -->
  <button id="btn-pos-direct-pay-nofish" type="button" class="pos-action-btn pos-btn-emerald" onclick="executeDirectPayment(false)" title="Hemen Ödeme Al (Fişsiz Satış) [F4]" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important; border-color: #34d399 !important; box-shadow: 0 2px 10px rgba(16,185,129,0.35);">
    <div class="pos-action-icon">💵</div>
    <div class="pos-action-text" style="color: #ffffff; font-weight: 900;">ÖDEME AL</div>
    <div class="pos-action-badge" style="color: #d1fae5; font-weight: 800;">[F4]</div>
  </button>

  <!-- 5. ÖDEME AL & YAZDIR (F12 - MAVİ BUTON) -->
  <button id="btn-pos-direct-pay-print" type="button" class="pos-action-btn pos-btn-blue" onclick="executeDirectPayment(true)" title="Ödeme Al ve Fiş Yazdır [F12]" style="background: linear-gradient(135deg, #0284c7 0%, #1d4ed8 100%) !important; border-color: #38bdf8 !important; box-shadow: 0 2px 10px rgba(56,189,248,0.35);">
    <div class="pos-action-icon">🖨️</div>
    <div class="pos-action-text" style="color: #ffffff; font-weight: 900;">YAZDIR</div>
    <div class="pos-action-badge" style="color: #e0f2fe; font-weight: 800;">[F12]</div>
  </button>

  <!-- 6. FİŞ BEKLET (F6) -->
  <button id="btn-pos-action-hold" type="button" class="pos-action-btn pos-btn-amber" onclick="parkCurrentReceipt()" title="Mevcut Sepeti Askıya Al / Beklet [F6]" style="background: rgba(245,158,11,0.18); border-color: rgba(245,158,11,0.45);">
    <div class="pos-action-icon">⏳</div>
    <div class="pos-action-text" style="color: #fbbf24;">FİŞ BEKLET</div>
    <div class="pos-action-badge" style="color: #fbbf24;">[F6]</div>
  </button>

  <!-- 7. KASA ÇIKIŞ (F7) -->
  <button id="btn-pos-action-cash-movement" type="button" class="pos-action-btn" onclick="openPosCashMovementModal()" title="Kasadan Para Çıkışı Yap (Toptancı, Fırın, Gider vb.) [F7]" style="background: rgba(239,68,68,0.18); border-color: rgba(239,68,68,0.45);">
    <div class="pos-action-icon">💸</div>
    <div class="pos-action-text" style="color: #f87171;">ÇIKIŞ</div>
    <div class="pos-action-badge" style="color: #f87171;">[F7]</div>
  </button>

  <!-- 8. İADE (F8) -->
  <button id="btn-pos-action-return" type="button" class="pos-action-btn pos-btn-crimson" onclick="openPosReturnModal()" title="Ürün İadesi Al / Sepete Eksi Tutar Ekle [F8]">
    <div class="pos-action-icon">↩️</div>
    <div class="pos-action-text">İADE</div>
    <div class="pos-action-badge">[F8]</div>
  </button>

  <!-- 9. ESKİ SATIŞ (F9) -->
  <button id="btn-pos-action-recent" type="button" class="pos-action-btn pos-btn-purple" onclick="openPosRecentSalesModal()" title="Bekleyen Fişler ve Günün Satışları [F9]">
    <div class="pos-action-icon">📜</div>
    <div class="pos-action-text">ESKİ FİŞ</div>
    <div class="pos-action-badge">[F9]</div>
  </button>

  <!-- 10. VERESİYE (F11) -->
  <button id="btn-pos-action-credit" type="button" class="pos-action-btn pos-btn-sky" onclick="openPosCreditModal()" title="Veresiye Satış & Veresiye Tahsilatı Al [F11]" style="background: rgba(2,132,199,0.2); border-color: rgba(56,189,248,0.4);">
    <div class="pos-action-icon">📒</div>
    <div class="pos-action-text" style="color: #38bdf8; font-weight: 800;">VERESİYE</div>
    <div class="pos-action-badge" style="color: #38bdf8;">[F11]</div>
  </button>

</div>
