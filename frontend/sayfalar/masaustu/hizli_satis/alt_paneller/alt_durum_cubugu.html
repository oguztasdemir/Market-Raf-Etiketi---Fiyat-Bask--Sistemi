<!-- EN ALT İNCE DURUM & BİLGİ PANELİ (TAM GENİŞLİKTE 7 SÜTUNLU YAYILIM) -->
<div class="pos-footer-status-bar">
  
  <!-- 1. MOBİL BAĞLANTI QR (MERKEZ YERİNE) -->
  <button id="btn-pos-footer-mobile" type="button" class="pos-footer-item pos-footer-btn pos-footer-sky" onclick="openPosMobileQrModal()" title="Mobil Terminal QR Kodu Aç [F1]">
    <span>📱</span> MOBİL QR [F1]
  </button>

  <!-- 2. KASA NO (KASA 1) -->
  <button id="btn-pos-footer-terminal" type="button" class="pos-footer-item pos-footer-btn pos-footer-card" onclick="showTerminalInfo()" title="Terminal / Kasa No">
    <span>💻</span> KASA 1
  </button>

  <!-- 3. KASİYER (ADMİN) -->
  <button id="btn-pos-footer-admin" type="button" class="pos-footer-item pos-footer-btn pos-footer-emerald" onclick="openCashierSwitchModal()" title="Kasiyer Değiştir / Giriş">
    <span>👤</span> ADMİN
  </button>

  <!-- 4. ARA MUTABAKAT (X RAPORU) -->
  <button id="btn-pos-footer-x-report" type="button" class="pos-footer-item pos-footer-btn pos-footer-blue" onclick="openPosXReportModal()" title="Gün İçi Ara Mutabakat (X Raporu)">
    <span>📊</span> X RAPORU
  </button>

  <!-- 5. CANLI TARİH -->
  <div id="pos-footer-date" class="pos-footer-item pos-footer-card" title="Tarih">
    23.08.2026
  </div>

  <!-- 6. CANLI SAAT -->
  <div id="pos-footer-time" class="pos-footer-item pos-footer-card pos-footer-amber-text" title="Saat">
    11:00:00
  </div>

  <!-- 7. ONLİNE DURUMU -->
  <button id="btn-pos-footer-online" type="button" class="pos-footer-item pos-footer-btn pos-footer-emerald" onclick="checkOnlineServerStatus()" title="Canlı Bağlantı Durumu">
    <span>🟢</span> ONLINE
  </button>

  <!-- 8. ANA MENÜ -->
  <button id="btn-pos-footer-home" type="button" class="pos-footer-item pos-footer-btn pos-footer-amber" onclick="exitPosToHome()" title="Ana Menüye Dön [ESC]">
    <span>🏠</span> ANA MENÜ
  </button>

</div>
