<!-- =========================================================
     MODAL: KASİYER DEĞİŞTİR / SEÇ
     ========================================================= -->
<div id="modal-cashier-switch" class="modal-backdrop" style="display: none; position: fixed; inset: 0; background: rgba(5, 10, 20, 0.85); backdrop-filter: blur(6px); z-index: 999999; align-items: center; justify-content: center; padding: 15px; box-sizing: border-box;">
  <div class="modal-card" style="background: #0f172a; border: 1.5px solid rgba(56,189,248,0.4); border-radius: 12px; width: 440px; max-width: 95%; overflow: hidden; box-shadow: 0 20px 45px rgba(0,0,0,0.85); padding: 20px; box-sizing: border-box;">
    
    <!-- Başlık & Kapat Butonu -->
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; margin-bottom: 16px;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="font-size: 22px;">👤</span>
        <div>
          <h3 style="margin: 0; font-size: 16px; font-weight: 800; color: #f8fafc;">Kasiyer Değiştir</h3>
          <small style="color: #94a3b8; font-size: 12px;">Aktif satış yapan kasiyeri belirleyin</small>
        </div>
      </div>
      <button type="button" onclick="closeCashierSwitchModal()" class="modal-close-btn" style="background: #1e293b; border: 1px solid #334155; border-radius: 6px; color: #94a3b8; font-size: 16px; cursor: pointer; padding: 4px 10px; line-height: 1;">✕</button>
    </div>

    <!-- Kasiyer Seçimi -->
    <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px;">
      <div>
        <label style="display: block; font-size: 11.5px; font-weight: 700; color: #38bdf8; text-transform: uppercase; margin-bottom: 6px;">Kasiyer Seçin</label>
        <select id="cashier-select-dropdown" onkeydown="if(event.key==='Enter') submitCashierSwitch();" style="width: 100%; padding: 11px 14px; background: #070d1e; border: 1.5px solid #38bdf8; border-radius: 8px; color: #f8fafc; font-size: 14px; font-weight: 700; outline: none; box-sizing: border-box; cursor: pointer;">
          <option value="kasa1">Kasa 1 (Kasiyer 1)</option>
          <option value="kasa2">Kasa 2 (Kasiyer 2)</option>
          <option value="admin" selected>Yönetici (Admin) (Müdür)</option>
        </select>
      </div>
    </div>

    <!-- Alt Butonlar: Onayla & Kapat -->
    <div style="display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 14px;">
      <button type="button" onclick="closeCashierSwitchModal()" class="btn-secondary" style="padding: 9px 18px; font-size: 12.5px; font-weight: 700; border-radius: 8px; cursor: pointer;">
        ✕ Kapat (Esc)
      </button>
      <button type="button" id="btn-cashier-submit" onclick="submitCashierSwitch()" class="btn-primary" style="padding: 9px 22px; font-size: 13px; font-weight: 800; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 6px;">
        <span>✓</span>
        <span>Kasiyeri Seç ve Başla (Enter)</span>
      </button>
    </div>

  </div>
</div>
