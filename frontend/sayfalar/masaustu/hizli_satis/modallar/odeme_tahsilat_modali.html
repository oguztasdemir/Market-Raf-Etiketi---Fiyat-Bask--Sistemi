<!-- =========================================================
     MODAL: ÖDEME ALMA & TAHSİLAT MODALI
     ========================================================= -->
<div id="modal-pos-payment" class="modal-backdrop" style="position: fixed; inset: 0; background: rgba(4, 8, 16, 0.88); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 99999999;">
  <div style="background: #0f172a; border: 1px solid #334155; border-radius: 12px; width: 500px; max-width: 95%; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8); padding: 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px;">
    
    <!-- Başlık -->
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 10px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 20px;">💳</span>
        <div>
          <h3 style="color: #f8fafc; font-size: 16px; font-weight: 800; margin: 0;">Ödeme Alma & Tahsilat</h3>
          <small style="color: #94a3b8; font-size: 11.5px;">Tamamı veya parçalı olarak tahsil edebilirsiniz</small>
        </div>
      </div>
      <button type="button" onclick="closePosPaymentModal()" style="background: transparent; border: none; color: #94a3b8; font-size: 20px; cursor: pointer;">✕</button>
    </div>

    <!-- 3'lü Tutar Kutucukları (Toplam | Ödenen | Kalan) -->
    <div style="display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 8px;">
      <div style="background: rgba(15,23,42,0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 8px 10px; text-align: center;">
        <div style="font-size: 10.5px; color: #94a3b8; font-weight: 700;">TOPLAM TUTAR</div>
        <div id="pos-pay-grand-total" style="font-size: 16px; font-weight: 900; color: #f8fafc; font-family: monospace; margin-top: 2px;">0,00 TL</div>
      </div>
      <div style="background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.25); border-radius: 8px; padding: 8px 10px; text-align: center;">
        <div style="font-size: 10.5px; color: #34d399; font-weight: 700;">ALINAN ÖDEME</div>
        <div id="pos-pay-paid-amount" style="font-size: 16px; font-weight: 900; color: #10b981; font-family: monospace; margin-top: 2px;">0,00 TL</div>
      </div>
      <div style="background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.35); border-radius: 8px; padding: 8px 10px; text-align: center;">
        <div style="font-size: 10.5px; color: #f87171; font-weight: 800;">KALAN BAKİYE</div>
        <div id="pos-pay-remaining-amount" style="font-size: 19px; font-weight: 900; color: #ef4444; font-family: monospace; margin-top: 2px;">0,00 TL</div>
      </div>
    </div>

    <!-- 1. HIZLI SEÇENEK: KART / NAKİT / VERESİYE BUTONLARI -->
    <div style="display: grid; grid-template-columns: 1fr 1fr 1.1fr; gap: 8px;">
      <button type="button" onclick="payFullPosAmount('Kredi Kartı')" id="btn-pay-full-card" style="padding: 11px 8px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #ffffff; border: none; border-radius: 8px; font-weight: 900; font-size: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; box-shadow: 0 4px 12px rgba(59,130,246,0.3);">
        <span>💳 TAMAMI KART</span>
        <small id="btn-pay-full-card-sub" style="font-size: 10.5px; opacity: 0.95; font-family: monospace;">(0,00 TL)</small>
      </button>
      <button type="button" onclick="payFullPosAmount('Nakit')" id="btn-pay-full-cash" style="padding: 11px 8px; background: linear-gradient(135deg, #10b981, #059669); color: #ffffff; border: none; border-radius: 8px; font-weight: 900; font-size: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; box-shadow: 0 4px 12px rgba(16,185,129,0.3);">
        <span>💵 TAMAMI NAKİT</span>
        <small id="btn-pay-full-cash-sub" style="font-size: 10.5px; opacity: 0.95; font-family: monospace;">(0,00 TL)</small>
      </button>
      <button type="button" onclick="closePosPaymentModal(); openPosCreditModal('sale');" id="btn-pay-open-credit" style="padding: 11px 8px; background: linear-gradient(135deg, #0284c7, #0369a1); color: #ffffff; border: none; border-radius: 8px; font-weight: 900; font-size: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; box-shadow: 0 4px 12px rgba(2,132,199,0.35);">
        <span>📒 VERESİYE YAZ</span>
        <small style="font-size: 10.5px; opacity: 0.95;">(Açık Hesap)</small>
      </button>
    </div>

    <!-- 1.5. AKILLI NAKİT & PARA ÜSTÜ HESAPLAYICI (SMART CASH) -->
    <div style="background: rgba(16,185,129,0.06); border: 1.5px solid rgba(16,185,129,0.3); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <strong style="color: #34d399; font-size: 12px; display: flex; align-items: center; gap: 5px;">
          <span>💵</span> Akıllı Nakit & Para Üstü Hesabı:
        </strong>
        <button type="button" onclick="roundPosPaymentCents()" style="padding: 3px 8px; font-size: 11px; font-weight: 800; background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.35); border-radius: 6px; cursor: pointer;" title="Kuruşları en yakın tam tutara yuvarlar">
          ✂️ Kuruş Yuvarla
        </button>
      </div>

      <!-- Hızlı Banknot Tuşları -->
      <div style="display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px;">
        <button type="button" onclick="setCashTenderAmount('exact')" class="btn-secondary" style="padding: 6px 0; font-size: 11px; font-weight: 800; background: #1e293b; color: #38bdf8; border-color: rgba(56,189,248,0.4);">Tam Tutar</button>
        <button type="button" onclick="setCashTenderAmount(50)" class="btn-secondary" style="padding: 6px 0; font-size: 11px; font-weight: 800;">50 ₺</button>
        <button type="button" onclick="setCashTenderAmount(100)" class="btn-secondary" style="padding: 6px 0; font-size: 11px; font-weight: 800;">100 ₺</button>
        <button type="button" onclick="setCashTenderAmount(200)" class="btn-secondary" style="padding: 6px 0; font-size: 11px; font-weight: 800; background: rgba(16,185,129,0.15); color: #34d399; border-color: rgba(16,185,129,0.4);">200 ₺</button>
        <button type="button" onclick="setCashTenderAmount(500)" class="btn-secondary" style="padding: 6px 0; font-size: 11px; font-weight: 800; background: rgba(168,85,247,0.15); color: #c084fc; border-color: rgba(168,85,247,0.4);">500 ₺</button>
        <button type="button" onclick="setCashTenderAmount(1000)" class="btn-secondary" style="padding: 6px 0; font-size: 11px; font-weight: 800;">1000 ₺</button>
      </div>

      <!-- Alınan Nakit ve Para Üstü Göstergesi -->
      <div style="display: grid; grid-template-columns: 1.1fr 1.3fr; gap: 8px; align-items: center;">
        <div>
          <label style="font-size: 10.5px; color: #94a3b8; font-weight: 700; display: block; margin-bottom: 2px;">Alınan Nakit (₺):</label>
          <input type="number" id="pos-cash-tender-input" placeholder="0,00" step="any" oninput="calculateCashChange()" onkeydown="handleCashTenderKey(event)" style="width: 100%; padding: 8px 10px; font-size: 15px; font-weight: 900; font-family: monospace; background: #070d1e; border: 1.5px solid #10b981; border-radius: 6px; color: #34d399; outline: none; text-align: right; box-sizing: border-box;">
        </div>
        <div id="pos-cash-change-box" style="background: rgba(15,23,42,0.9); border: 1.5px solid #334155; border-radius: 6px; padding: 6px 10px; text-align: center; display: flex; flex-direction: column; justify-content: center; min-height: 42px;">
          <div style="font-size: 10px; color: #94a3b8; font-weight: 800; text-transform: uppercase;">PARA ÜSTÜ</div>
          <div id="pos-cash-change-text" style="font-size: 17px; font-weight: 900; color: #64748b; font-family: monospace;">0,00 TL</div>
        </div>
      </div>
    </div>

    <!-- 2. PARÇALI ÖDEME BÖLÜMÜ -->
    <div style="background: rgba(15,23,42,0.7); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <strong style="color: #cbd5e1; font-size: 11.5px;">✂️ Parçalı Ödeme Gir (Bakiyeden Düş):</strong>
        <span style="font-size: 10.5px; color: #64748b;">Örn: 50 TL Kart, kalanı Nakit</span>
      </div>

      <div style="display: flex; gap: 6px; align-items: center;">
        <input type="number" id="pos-pay-partial-input" placeholder="Tutar (Örn: 50)" step="any" onkeydown="handlePartialPaymentKey(event)" style="flex: 1; padding: 8px 10px; font-size: 14px; font-weight: 800; font-family: monospace; background: #070d1e; border: 1.5px solid #38bdf8; border-radius: 6px; color: #fff; outline: none; text-align: right;">
        
        <button type="button" onclick="addPartialPosPayment('Kredi Kartı')" style="padding: 8px 12px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: 800; font-size: 11.5px; cursor: pointer; white-space: nowrap;">
          💳 Kart Düş
        </button>
        <button type="button" onclick="addPartialPosPayment('Nakit')" style="padding: 8px 12px; background: #059669; color: #fff; border: none; border-radius: 6px; font-weight: 800; font-size: 11.5px; cursor: pointer; white-space: nowrap;">
          💵 Nakit Düş
        </button>
      </div>
    </div>

    <!-- 3. ALINAN PARÇALI ÖDEMELER LİSTESİ -->
    <div id="pos-pay-splits-container" style="display: none; background: #070d1e; border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; padding: 8px 10px; max-height: 95px; overflow-y: auto;">
      <div style="font-size: 11px; color: #94a3b8; font-weight: 700; margin-bottom: 4px;">Alınan Parçalı Ödemeler:</div>
      <div id="pos-pay-splits-list" style="display: flex; flex-direction: column; gap: 4px;"></div>
    </div>

    <!-- Alt Eylem Butonları -->
    <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 12px; margin-top: 4px;">
      <div style="display: flex; align-items: center; gap: 6px;">
        <input type="checkbox" id="pos-pay-print-receipt-chk" checked style="width: 16px; height: 16px; accent-color: #38bdf8; cursor: pointer;">
        <label for="pos-pay-print-receipt-chk" style="font-size: 12px; color: #cbd5e1; cursor: pointer; user-select: none;">Fiş Yazdır</label>
      </div>

      <div style="display: flex; gap: 8px;">
        <button type="button" onclick="closePosPaymentModal()" class="btn-secondary" style="padding: 8px 14px; font-size: 12.5px;">Vazgeç (ESC)</button>
        <button type="button" id="btn-pos-finalize-split-sale" onclick="finalizeSplitPosSale()" class="btn-primary" style="padding: 8px 18px; font-size: 13px; font-weight: 900; background: linear-gradient(135deg, #10b981, #059669);" disabled>
          ✔ Satışı Tamamla
        </button>
      </div>
    </div>

  </div>
</div>
