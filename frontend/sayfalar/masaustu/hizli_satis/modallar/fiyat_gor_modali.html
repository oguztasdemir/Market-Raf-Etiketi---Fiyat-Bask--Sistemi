<div id="modal-pos-price-check" class="modal-backdrop" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 99999; align-items: center; justify-content: center;">
    <div style="background: #1e293b; border: 1px solid #334155; border-radius: 8px; width: 500px; max-width: 95%; overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); padding: 20px; box-sizing: border-box;">
      
      <!-- Başlık & Kapat Butonu -->
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 12px; margin-bottom: 14px;">
        <div>
          <h3 style="margin: 0; font-size: 15px; font-weight: 700; color: #f8fafc;">Ürün Fiyat & Stok Sorgula [F6]</h3>
          <small style="color: #94a3b8; font-size: 12px;">Barkod okutun veya ürün adı yazın</small>
        </div>
        <button onclick="closePosPriceCheckModal()" style="background: transparent; border: none; color: #94a3b8; font-size: 20px; cursor: pointer; padding: 2px 6px;">&times;</button>
      </div>

      <!-- Barkod Girişi -->
      <div style="margin-bottom: 12px;">
        <input type="text" id="pos-price-check-input" placeholder="Barkod okutun veya yazın..." oninput="handlePosPriceCheckLive(this.value)" onkeydown="handlePosPriceCheckKey(event)" style="width: 100%; padding: 10px 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #ffffff; font-family: monospace; font-size: 14px; font-weight: 600; outline: none; box-sizing: border-box;">
      </div>

      <!-- Sonuç Kartı -->
      <div id="pos-price-check-result" style="background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 14px; text-align: center; min-height: 120px; display: flex; flex-direction: column; justify-content: center; align-items: center;">
        <div style="font-size: 13px; color: #64748b;">Barkod okutulması bekleniyor...</div>
      </div>

      <!-- Alt Butonlar -->
      <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #334155; padding-top: 12px; margin-top: 14px;">
        <button type="button" onclick="closePosPriceCheckModal()" style="padding: 8px 16px; font-size: 13px; font-weight: 600; background: #334155; border: 1px solid #475569; color: #e2e8f0; border-radius: 6px; cursor: pointer;">Kapat (Esc)</button>
        <button type="button" id="btn-add-checked-to-cart" onclick="addFoundProductToPosCart()" style="display: none; padding: 8px 18px; font-size: 13px; font-weight: 700; background: #16a34a; color: #ffffff; border: none; border-radius: 6px; cursor: pointer;">
          Sepete Ekle (Enter)
        </button>
      </div>

    </div>
  </div>

  <!-- =========================================================
       MODAL: ESKİ SATIŞLAR & BEKLEYEN FİŞLER
       ========================================================= -->
